<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Загрузка... — KAZARBUILD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b98fb">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="card">
  <header class="header">
    <a href="index.html" class="logo">KAZARBUILD</a>
    <div class="burger" id="burger" aria-label="Открыть меню" role="button" tabindex="0">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <nav class="menu" id="menu">
    <div class="language-switcher">
      <button class="lang-btn active" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="kz">KZ</button>
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="tk">TK</button>
    </div>
    <a href="index.html" data-i18n="nav.catalog">Тех.карты</a>
  </nav>

  <section class="card-hero" id="card-hero">
    <div class="card-carousel" id="card-carousel">
      <div class="card-slide"></div>
    </div>
    <div class="card-hero-overlay"></div>
    <div class="card-hero-content">
      <span class="card-hero-category" id="card-category">Категория</span>
      <h1 class="card-hero-title" id="card-title">Загрузка...</h1>
    </div>
  </section>

  <div class="card-back-wrapper">
    <a href="index.html" class="card-back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Назад</span>
    </a>
  </div>

  <main class="card-container">

    <section class="card-block" id="description-block">
      <p class="card-description" id="card-description"></p>
    </section>

    <div id="card-sections"></div>

    <button class="card-checklist-btn" id="checklist-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span id="checklist-btn-text">Чек-лист</span>
      <svg class="card-checklist-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
    <div class="card-checklist-panel" id="checklist-panel">
      <ul class="card-checklist" id="checklist-items">
      </ul>
      
      <button class="card-checklist-reset" id="checklist-reset" onclick="sendToWhatsApp()"> 
        Send to WhatsApp
      </button>
    </div>
  </main>
  <footer class="footer"></footer>

  <!-- Section Page (Full Screen) -->
  <div class="section-page" id="section-page">
    <div class="section-page-header">
      <button class="section-page-back" id="section-page-back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="section-page-title" id="section-page-title">Секция</h1>
    </div>
    <div class="section-page-body">
      <div class="section-page-container">
        <div class="section-page-content" id="section-page-content">
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/card.js"></script>
  <script>
    function sendToWhatsApp() {
    const text = document.getElementById("checklist-items").innerText;
    const encodedText = encodeURIComponent(text);
    window.open(`https://wa.me/?text=${encodedText}`, "_blank");
    }
  </script>
</body>
</html>
