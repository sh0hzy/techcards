      { id:'waterproofing-mastic', title: ml('Mastic Waterproofing','Мастичная гидроизоляция','Mastikali gidroizolyatsiya','Mastikaly gidroizolýasiýa','Мастикалық гидрооқшаулау'), desc: ml('Mastic waterproofing application','Применение мастичной гидроизоляции','Mastikali gidroizolyatsiyani qoʻllash','Mastikaly gidroizolýasiýany ulanmak','Мастикалық гидрооқшаулауды қолдану'), content: { ru: `<p>АВЕНКО применяет готовую гидроизоляционную мастику на всех объектах.</p><h3>Запрещено</h3><ul><li>Наносить мастику менее чем в 2 слоя</li><li>Работать без гидроизоляционных лент/манжет на выводах, углах и стыках</li><li>Частичное нанесение на гипсовую штукатурку (покрывать все гипсовые поверхности)</li><li>Наносить на влажное или сырое цементное основание</li><li>Гидроизолировать вокруг канализационных стояков (риск затопления)</li></ul><h3>Виды гидроизоляции</h3><ul><li><b>Готовая мастика:</b> для всех внутренних оснований, наносится кистью/валиком</li><li><b>Сухая цементная:</b> 2 перпендикулярных слоя, предварительное увлажнение основания</li><li><b>Рулонная мембрана:</b> ~0,5 мм, наносится на клей шпателем, снижает передачу нагрузок</li></ul>` } },
      { id:'roll-membranes', title: ml('Roll Membranes','Рулонные мембраны','Rulon membranalar','Rulon membranalar','Орамалық мембраналар'), desc: ml('Roll membrane waterproofing','Рулонная мембранная гидроизоляция','Rulon membranali gidroizolyatsiya','Rulon membranaly gidroizolýasiýa','Орамалық мембраналық гидрооқшаулау'), content: { ru: `<h3>Общие сведения</h3><p>Рулонная гидроизоляционная мембрана (SCHULTER DITRA, КНАУФ-МЕМБРАНА) — аналог обмазочной гидроизоляции в два слоя. Компенсирует напряжение между основанием и плиткой, предотвращает трещины облицовки.</p><ul><li>Укладывается на клей класса C2TE S1 или S2; облицовка плиткой — сразу после укладки на тот же клей</li><li>Подходит для деревянных, цементных, бетонных оснований, ангидритных стяжек, тёплых полов</li><li>Ширина полотна 1 м, толщина 3 мм; есть вариант с пазами для кабельного тёплого пола</li></ul><h3>Монтаж</h3><ul><li>Основание — чистое, ровное, способное нести нагрузку</li><li>Нанести клей на всю поверхность зубчатой кельмой 3×3 мм или 4×4 мм</li><li>Уложить маты и вдавить штукатурной тёркой, работая в одном направлении; дорожки впритык</li><li>На стыки матов (в санузлах) — лента Schlüter-KERDI-KEBA 12,5 см шириной на клее KERDI-COLL-L</li><li>Стык пол/стена — лента KERDI-KEBA на мат (мин. 5 см) и на стену на клее KERDI-COLL-L</li><li>После приклеивания матов — плитку можно класть немедленно</li></ul>` } },

document.querySelector('.summary').innerHTML = `
  <p>This will insert <span>${CATEGORIES.length} categories</span> and <span>${CATEGORIES.length} cards</span> (one card per category, subcategories become sections).</p>
  <p>Target: <span>${SUPABASE_URL}</span></p>
  <p><strong>Step 1:</strong> Clears existing cards &amp; categories. <strong>Step 2:</strong> Inserts fresh data.</p>
`;

async function supabaseDelete(table) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=not.is.null`, {
    method: 'DELETE',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=minimal'
    }
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`${res.status}: ${errText}`);
  }
}

// Build content object: each subcategory becomes a section, per language
function buildContent(subcards) {
  const langs = ['ru', 'kz', 'uz', 'en', 'tk'];
  const content = {};
  langs.forEach(lang => {
    content[lang] = {
      sections: subcards.map(sub => ({
        title: sub.title[lang] || sub.title.ru || sub.title.en || '',
        content: (sub.content && (sub.content[lang] || sub.content.ru || sub.content.en))
          || `<p>${sub.desc[lang] || sub.desc.ru || sub.desc.en || ''}</p>`,
        images: [],
        nestedSections: (sub.nestedSections || []).map(ns => ({
          title: ns.title[lang] || ns.title.ru || ns.title.en || '',
          content: ns.content[lang] || ns.content.ru || ns.content.en || '',
          images: []
        }))
      })),
      checklist: []
    };
  });
  return content;
}

async function runMigration() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'Migration in progress...';

  let catCount = 0, cardCount = 0, errCount = 0;

  // Step 1: Clear existing data
  log('Clearing existing cards...', 'log-warn');
  try {
    await supabaseDelete('cards');
    log('  Cards cleared.', 'log-ok');
  } catch (e) {
    log(`  WARNING clearing cards: ${e.message}`, 'log-warn');
  }

  log('Clearing existing categories...', 'log-warn');
  try {
    await supabaseDelete('categories');
    log('  Categories cleared.', 'log-ok');
  } catch (e) {
    log(`  WARNING clearing categories: ${e.message}`, 'log-warn');
  }

  log('', 'log-info');
  log('Starting fresh insert...', 'log-info');
  log('', 'log-info');

  // Step 2: Insert categories and one card per category
  for (const cat of CATEGORIES) {
    log(`Inserting category: ${cat.name.en} ${cat.icon}`, 'log-info');
    try {
      const catData = {
        name: cat.name,
        icon: cat.icon,
        sort_order: cat.sort,
        slug: generateSlug(cat.name.ru || cat.name.en)
      };
      const result = await supabaseInsert('categories', catData);
      const categoryId = result[0].id;
      catCount++;
      log(`  ✓ Category inserted (id: ${categoryId})`, 'log-ok');

      // Build one card with subcategories as sections
      const cardData = {
        title: cat.name,
        description: { ru: '', kz: '', uz: '', en: '', tk: '' },
        content: buildContent(cat.cards),
        category_id: categoryId,
        is_published: true,
        slug: generateSlug(cat.name.ru || cat.name.en),
        views_count: 0,
        images: [],
        cover_image: null,
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };

      try {
        await supabaseInsert('cards', cardData);
        cardCount++;
        log(`  ✓ Card inserted with ${cat.cards.length} sections`, 'log-ok');
      } catch (e) {
        errCount++;
        log(`  ERROR card: ${e.message}`, 'log-err');
      }

    } catch (e) {
      errCount++;
      log(`  ERROR category "${cat.name.en}": ${e.message}`, 'log-err');
    }

    progressEl.textContent = `Progress: ${catCount}/${CATEGORIES.length} categories, ${cardCount} cards, ${errCount} errors`;
  }

  log('', 'log-info');
  log('=== MIGRATION COMPLETE ===', 'log-ok');
  log(`Categories: ${catCount}/${CATEGORIES.length}`, catCount === CATEGORIES.length ? 'log-ok' : 'log-warn');
  log(`Cards: ${cardCount}/${CATEGORIES.length}`, cardCount === CATEGORIES.length ? 'log-ok' : 'log-warn');
  log(`Errors: ${errCount}`, errCount === 0 ? 'log-ok' : 'log-err');

  btn.textContent = errCount === 0 ? 'Migration Complete!' : `Done with ${errCount} errors`;
  progressEl.textContent = `Final: ${catCount} categories, ${cardCount} cards, ${errCount} errors`;
}
