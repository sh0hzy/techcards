function log(msg, cls='log-info') {
  const d = document.createElement('div');

  logEl.appendChild(d);

function generateSlug(text) {
  const translitMap = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
  return text.toLowerCase().split('').map(c => translitMap[c] || c).join('').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').substring(0, 36) + '-' + Date.now();
}

async function supabaseInsert(table, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(data)
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`${res.status}: ${errText}`);
  }
  return await res.json();
}

      { id:'finishing-removal', title: ml('Finishing Removal','Удаление отделки','Bezakni olib tashlash','Bezegi aýyrmak','Әрлеуді алу'), desc: ml('Removing existing finishing materials','Удаление существующих отделочных материалов','Mavjud bezak materiallarini olib tashlash','Bar bolan bezeg materiallaryny aýyrmak','Бар әрлеу материалдарын алу'), content: { ru: `<p>К чистовым покрытиям относятся: обои, краска, декоративная шпаклёвка, панели, вагонка. После работ — обязательная уборка и проверка на отсутствие остатков.</p><h3>Подготовка</h3><ul><li>Освободить помещение, застелить пол оргалитом</li><li>Снять плинтусы или защитить скотчем</li><li>Обесточить розетки и выключатели, изолировать провода</li></ul><h3>Удаление обоев</h3><ul><li><b>Механически:</b> намочить → поддеть шпателем от шва, снять полосами; влагостойкие — предварительно насечки ножом или игольчатым валиком</li><li><b>Химически:</b> развести средство по инструкции, нанести валиком, выдержать, убрать шпателем</li><li><b>Паром:</b> парогенератор направить на шов → обои отходят; для влагостойких — сначала игольчатый валик</li><li><b>Жидкие обои:</b> горячая вода → дать набухнуть → убрать шпателем</li><li><b>С гипсокартона:</b> нанести клей для обоев → размочить → снять шпателем полосками</li></ul><h3>Удаление краски</h3><ul><li>Акриловую: намочить, снять шпателем</li><li>УШМ с алмазным диском — быстро и качественно, дают чистое основание</li><li>Латексные/масляные химически — только в проветриваемых помещениях</li></ul><h3>Удаление штукатурки, шпаклёвки, панелей</h3><ul><li>УШМ с алмазным диском — самый эффективный метод, снимает краску и шпаклёвку одновременно</li><li>Перфоратор с лопаткой — для шпаклёвки предварительно увлажнить</li><li>Панели (ПВХ, вагонка) — демонтируются вручную без инструмента</li></ul>` } },
      { id:'rough-covering', title: ml('Rough Covering Removal','Удаление чернового покрытия','Qoralama qoplamani olib tashlash','Çig örtügi aýyrmak','Өңделмеген жабынды алу'), desc: ml('Removing rough coverings and substrates','Удаление черновых покрытий и оснований','Qoralama qoplama va asoslarni olib tashlash','Çig örtükleri we esaslary aýyrmak','Өңделмеген жабындылар мен негіздерді алу'), content: { ru: `<p>К черновым покрытиям относятся: штукатурка потолков и стен, стяжка пола, межкомнатные перегородки.</p><h3>Демонтаж штукатурки</h3><p>Демонтаж оправдан при наличии трещин, вздутия, влажных пятен, плохой адгезии или сильных отклонений от плоскости. Если планируется укладка плитки — снять штукатурку обязательно.</p><ul><li>Перфоратор с насадкой-лопаткой, работать сверху вниз</li><li>Максимально очистить стену — от этого зависит дальнейшая адгезия</li><li>Остатки снимаются шлифовальным диском с пылеотведением</li></ul><h3>Демонтаж стяжки пола</h3><ul><li>Выполняется при наличии трещин, отслоения («бухтит») или сильной кривизны</li><li>Перфоратор или отбойник; мусор упаковать в мешки</li><li>Учитывать коммуникации (трассы водоснабжения, отопления, электрики)</li></ul><h3>Демонтаж перегородок</h3><p><b>Разбирать только по частям, сверху вниз. Запрещено валить стены целиком!</b></p><ul><li><b>ГКЛ:</b> снять листы с каркаса, затем разобрать металлоконструкцию</li><li><b>Газобетон/пеноблок:</b> кувалда или перфоратор, от стыка с потолком вниз</li><li><b>Кирпич:</b> кувалда, от стыка с потолком вниз, не кидать куски на пол</li><li><b>Пазогребневые плиты:</b> ломать на шве и снимать руками, целыми плитами</li></ul><h3>Зачистка монолитных оснований</h3><p><b>Цементное молочко</b> снижает адгезию до 50% — его обязательно удалить.</p><ul><li>УШМ/болгарка с алмазной чашкой и пылеотведением — зачистить «молочко», открыть поры</li><li>Зачистка потолка — физически тяжело, работать в паре, чередуясь</li></ul>` } },
      { id:'flooring-dismantling', title: ml('Flooring Dismantling','Демонтаж пола','Polni demontaj qilish','Poly sökmek','Еденді бөлшектеу'), desc: ml('Floor covering removal procedures','Процедуры удаления напольных покрытий','Pol qoplamalarini olib tashlash tartiblari','Pol örtüklerini aýyrmak amallary','Еден жабындарын алу рәсімдері'), content: { ru: `<h3>Дерево, паркет</h3><ul><li>Освободить помещение от мебели, убрать плинтусы</li><li>Начинать с края, от стены с дверью</li><li>Лобзиком/ножовкой сделать пропил вдоль доски у стены, вставить лом, приподнять</li><li>Пропиливать половицы перпендикулярно секциями по 30 см</li><li>Если пол сохраняется — снимать аккуратно, пронумеровать каждую доску</li><li>Работать в перчатках; под досками могут проходить коммуникации</li></ul><h3>Ламинат, паркетная доска</h3><ul><li>Снять крайний ряд, затем разбирать как конструктор</li><li>Работа руками в перчатках</li></ul><h3>Рулонные покрытия (линолеум)</h3><ul><li>Если не приклеено — снять и свернуть в рулон</li><li>Если приклеено — скребки и шпатели; счистить остатки клея с основания</li></ul>` } },
      { id:'ceiling-dismantling', title: ml('Ceiling Dismantling','Демонтаж потолка','Shiftni demontaj qilish','Potology sökmek','Төбені бөлшектеу'), desc: ml('Ceiling removal and preparation','Демонтаж и подготовка потолка','Shiftni demontaj qilish va tayyorlash','Potology sökmek we taýýarlamak','Төбені бөлшектеу және дайындау'), content: { ru: `<h3>Типы подвесных потолков</h3><ul><li><b>Плитный:</b> удалить вручную, поддевая плитки шпателем</li><li><b>Гипсокартонный:</b> удалить серпянку, открутить саморезы, снять листы, разобрать металлоконструкцию</li><li><b>Кассетный:</b> снять кассеты присосками, разобрать металлическую конструкцию</li><li><b>Реечный:</b> поддеть замок отвёрткой, демонтировать шины-стрингеры, разжать зажимы; профили на дюбелях — шуруповёрт, на анкерах — гаечный ключ</li></ul><h3>Очистка окрашенного потолка</h3><ul><li><b>Термический:</b> строительный фен до 50°С, краска пластична и легко снимается шпателем (не более 15 мин непрерывно)</li><li><b>Механический:</b> шлифовальная машина или дрель с насадкой для шлифовки</li><li><b>Химический:</b> зачистить металлической щёткой, нанести средство, выдержать по инструкции, удалить шпателем и протереть водой</li></ul>` } },
      { id:'tile-dismantling', title: ml('Tile Dismantling','Демонтаж плитки','Plitkani demontaj qilish','Plitka sökmek','Плитканы бөлшектеу'), desc: ml('Tile removal techniques','Техники удаления плитки','Plitkani olib tashlash texnikalari','Plitka aýyrmak usullary','Плитканы алу әдістері'), content: { ru: `<p><b>Предварительно изучить, где проходят инженерные сети.</b></p><h3>Если плитка не сохраняется</h3><ul><li>Зубило и молоток — быстрый и эффективный способ</li><li>Удар молотком по краю → вставить зубило под 45° → плитка крошится и отходит</li><li>Перфоратор с плоской насадкой-лопаткой — в разы ускоряет работу</li><li>Начинать с верхнего левого угла, двигаться горизонтально сверху вниз</li><li>Для очистки от клея: замочить в тёплой мыльной воде на несколько часов</li><li><b>Перфоратор не подходит:</b> у труб, за батареями, в труднодоступных местах</li></ul><h3>Если плитку нужно сохранить</h3><ul><li>Удалить межплиточные швы ножом или расшивкой (при необходимости размочить водой)</li><li>Дрелью с диском по камню сделать разрез между швами</li><li>Перфоратор с широкой лопаткой — аккуратно вставить в разрез, сделать выемки у краёв</li><li>Лопатка заходит под плитку → снять без повреждений</li></ul>` } },
      { id:'dismantling-checklist', title: ml('Checklist','Чек-лист','Tekshiruv roʻyxati','Barlag sanawy','Тексеру тізімі'), desc: ml('Dismantling verification checklist','Контрольный список демонтажных работ','Demontaj ishlarining tekshiruv roʻyxati','Sökmek işleriniň barlag sanawy','Бөлшектеу жұмыстарының тексеру тізімі'), content: { ru: `<h3>Проверка после демонтажа</h3><ul><li>Свериться с проектом и планом помещения</li><li>Выявить существующие недочёты, в том числе из-за износа здания</li><li>Убедиться, что несущая способность стен, потолка и пола не нарушена</li><li>Проверить работоспособность и целостность инженерных коммуникаций</li><li>Монолитные бетонные основания зачищены шлифовальной машиной — цементное молочко удалено</li><li>Стены, потолок и пол подготовлены к дальнейшим работам</li></ul><h3>Финальный осмотр</h3><ul><li>Соблюдение норм СНиП и ГОСТов, отсутствие несогласованных изменений</li><li>Отсутствие мусора, грязи и пыли после демонтажа</li><li>Полы качественно пропылесосены</li><li>МОП на этаже, лифт и первый этаж — чистые</li><li>Имущество заказчика и МОП не пострадало</li><li>Отсутствуют опасные объекты: открытые провода, незакрытые газовые соединения, острая арматура</li></ul><h3>Запрещено при демонтаже</h3><ul><li>Выбивать и ронять стены ногами и руками</li><li>Самовольно снимать оборудование без согласования</li><li>Нарушать несущие конструкции</li><li>Блокировать вентиляционные пути</li><li>Прокладывать диагональные штробы</li></ul>` } }
    ]
  },

    name: ml('Wall Masonry','Кладка стен','Devor qurish','Diwar ýasamak','Қабырға құрылысы'),
    cards: [
      { id:'aerated-concrete', title: ml('Aerated Concrete','Газобетон','Gazobeton','Gazbeton','Газбетон'), desc: ml('Aerated concrete block masonry techniques','Техники кладки газобетонных блоков','Gazobeton bloklarini yotqizish texnikalari','Gazbeton bloklaryny ýerleşdirmek usullary','Газбетон блоктарын төсеу әдістері'), content: { ru: `<h3>Подготовка основания</h3><ul><li>Подготовить инструменты и материалы согласно перечню</li><li>Расшить примыкания возведённых стен от застройщика к монолитным перекрытиям по всему периметру</li><li>Зачистить и удалить пену по периметру в зонах примыкания к несущим основаниям</li><li>Запенить все отверстия и пустоты выводов труб противопожарной монтажной пеной</li><li>Очистить основание от пыли, грязи и отслаивающихся частей, пропылесосить</li><li>Загрунтовать места, где планируется возведение перегородки</li></ul><h3>Разметка и монтаж демпфера</h3><ul><li>Выполнить первую разметку предельно точно — она задаст ИДЕАЛЬНУЮ геометрию помещения</li><li>Внимательно изучить проект с учётом толщины штукатурки и плитки</li><li>Убедиться, что в заданные габариты помещений поместится сантехника и мебель</li><li>Определить ось объекта по самой длинной стене, разметить все стены по проекту</li><li>Для разметки применять малярный скотч двумя параллельными линиями</li></ul><h3>Основание для первого ряда</h3><ul><li>Пробковый демпфер не использовать — через 2 года сильно затвердевает</li><li>При необходимости защиты от капиллярной влаги применять отсечную гидроизоляцию на битумную мастику</li><li>Смонтировать демпферную виброгасящую ленту ТехноСонус Стопзвук V100 (4 мм) на универсальный контактный клей</li></ul><h3>Материалы</h3><ul><li>Пеноблоки/газобетон, перемычки для проёмов, клей Kiilto/YTONG для тонкошовной кладки</li><li>Цементно-песчаная смесь, маяки 10 мм, пена монтажная противопожарная</li><li>Гибкие связи, демпферный звукоизоляционный материал, дюбель-гвозди</li><li>Грунт глубокого проникновения, малярная лента профессиональная</li></ul><h3>Инструменты</h3><ul><li>Пылесос строительный с циклонным фильтром, штроборез, перфоратор, шуруповёрт</li><li>Лазерный осепостроитель, пузырьковый уровень, большой угольник каменщика, рулетка</li><li>Кельма для газобетона Ytong 100 мм, киянка резиновая, пила по газоблоку</li></ul>` } },
      { id:'gypsum-plates', title: ml('Gypsum Plates','Гипсовые плиты','Gipsli plitalar','Gips plitalary','Гипс плиталары'), desc: ml('Gypsum plate wall construction','Строительство стен из гипсовых плит','Gipsli plitalardan devor qurish','Gips plitalaryndan diwar gurmak','Гипс плиталарынан қабырға тұрғызу') }

  {
    sort: 5, icon: '🎨',
    name: ml('Plastering','Штукатурка','Shpaklyovka','Gipslemek','Сылақ'),
    cards: [
      { id:'plaster-materials', title: ml('Plaster Materials','Штукатурные материалы','Shtukaturka materiallari','Gipsleme materiallary','Сылақ материалдары'), desc: ml('Overview of plastering materials','Обзор штукатурных материалов','Shtukaturka materiallarining umumiy koʻrinishi','Gipsleme materiallaryna syn','Сылақ материалдарына шолу'), content: { ru: `<p>Правильную геометрию помещения задаёт именно этап штукатурки.</p><h3>Разделы</h3><ul><li>Материал и инструмент</li><li>Подготовительные работы</li><li>Грунтовка</li><li>Армирование, сопряжения, углы</li><li>Установка маяков</li><li>Нанесение штукатурки</li><li>Штукатурные откосы</li><li>Штукатурка потолка</li><li>Механизированная штукатурка стен</li></ul>` } },
      { id:'plaster-preparation', title: ml('Surface Preparation','Подготовка поверхности','Yuzani tayyorlash','Ýüzi taýýarlamak','Бетті дайындау'), desc: ml('Preparing surfaces for plastering','Подготовка поверхностей для штукатурки','Shtukaturka uchun yuzalarni tayyorlash','Gipsleme üçin ýüzleri taýýarlamak','Сылақтау үшін беттерді дайындау'), content: { ru: `<h3>Распространённые ошибки</h3><ul><li>Отклонения плоскости</li><li>Некачественное или отсутствующее грунтование</li><li>Применение бетоноконтакта на газобетоне</li></ul>` } },
      { id:'priming', title: ml('Priming','Грунтовка','Gruntlash','Gruntlamak','Грунттау'), desc: ml('Primer application techniques','Техники нанесения грунтовки','Grunt qoʻllash texnikalari','Grunt çalmak usullary','Грунт қолдану әдістері'), content: { ru: `<h3>Важно</h3><p>Определить материал основания, понять как с ним работать, чем грунтовать и чем штукатурить.</p><h3>По типу основания</h3><ul><li><b>Монолитный бетон:</b> только бетоноконтакт для гипсовой штукатурки; зачистить от цементного молочка</li><li><b>Газобетон, шлакоблок, керамзитобетон, кирпич:</b> только плёночный грунт (КНАУФ-МУЛЬТИГРУНД или КНАУФ-МИТТЕЛЬГРУНД) — не глубокого проникновения и не бетоноконтакт</li><li><b>Кирпичные стены:</b> грунт глубокого проникновения КНАУФ-ТИФЕНГРУНД</li><li><b>Цементная штукатурка:</b> адгезионная грунтовка глубокого проникновения</li></ul><h3>Порядок работ</h3><ul><li>Рекомендуется использовать концентрат грунтовки</li><li>Наносить садовым опрыскивателем — быстрее и эффективнее</li><li>Бетоноконтакт наносить валиком или кистью</li><li>Сначала обработать штробы, затем стены</li><li>Дождаться полного высыхания — до 6 часов согласно инструкции</li></ul>` } },
      { id:'beacon-installation', title: ml('Beacon Installation','Установка маяков','Mayoqlarni oʻrnatish','Maýaklary ornaşdyrmak','Маяктарды орнату'), desc: ml('Setting up guide beacons for plastering','Установка направляющих маяков для штукатурки','Shtukaturka uchun yoʻnaltiruvchi mayoqlarni oʻrnatish','Gipsleme üçin ugur görkeziji maýaklary ornaşdyrmak','Сылақтау үшін бағыттаушы маяктарды орнату'), content: { ru: `<h3>Виды маяков</h3><p>Применяется только маячковый профиль. Растворные и струнные маяки в компании не применяются — при работе по ним правилом плоскость стирается и нарушается геометрия.</p><h3>Определение плоскости</h3><ul><li>Лазерным осепостроителем проецировать плоскость вдоль стены и медленно приближать до пропадания луча</li><li>Сделать метки карандашом на двух перпендикулярных стенах</li><li>От меток отступить 11 см (10 см правило + 1 см толщина маяка), сделать отметки</li><li>Переставить луч по новым меткам — приступить к установке маяков</li></ul><h3>Установка маяков</h3><ul><li>Шаг маяков не более длины правила; рекомендуется 1 м, максимум 1,5 м</li><li>Маяки от углов и дверных коробок: не далее 15 см</li><li>Устанавливать только на точки (шлепки), шаг не более 30 см — не на сплошной слой</li><li>Верхний и нижний край маяка обязательно подмазать штукатуркой</li><li>Порядок: сначала крайние маяки, затем центральный</li><li>Все маяки должны быть в одной плоскости по лазеру и пузырьковому уровню</li><li>Проверить углы 90° по установленным маякам перед штукатуркой</li></ul><h3>Важно</h3><ul><li>Новые маяки замяты по краям — отрезать пару см болгаркой</li><li>Периодически вытирать правило от штукатурки, чтобы не было бугров</li><li>Если откосы получаются разной глубины при соблюдении геометрии — развернуть стену с окнами</li></ul>` } },
      { id:'reinforcement', title: ml('Reinforcement','Армирование','Armaturalash','Armaturlamak','Арматуралау'), desc: ml('Mesh and reinforcement techniques','Техники армирования и использования сетки','Toʻr va armaturalash texnikalari','Tor we armaturlamak usullary','Тор және арматуралау әдістері'), content: { ru: `<h3>Важно</h3><ul><li>Газобетон, ПГП, пеноблок, керамзитобетон — обязательно армировать стеклопластиковой сеткой</li><li>Все дверные и оконные проёмы армируются по периметру — зона повышенной деформации</li><li>Сетка должна быть в теле штукатурки, а не между стеной и штукатуркой</li></ul><h3>Порядок армирования</h3><ul><li>Нанести контактный слой ~5 мм (плиточный клей или штукатурно-клеевая смесь) гребенчатым шпателем</li><li>Приложить рулон сетки, разгладить кельмой, вдавить — раствор должен проступать поверх ячеек</li><li>Перехлёст между рулонами — 10 см; выпуск на потолок — 10 см</li><li>Углы оконных/дверных проёмов: выпуск 15 см или на глубину откоса</li><li>Армирующий слой обязательно грунтуется после застывания</li></ul><h3>Примыкание штукатурки к полу и потолку</h3><ul><li>Демпферная лента КНАУФ-ДИХТУНГСБАНД по периметру в зоне контакта с полом и потолком</li><li>После штукатурки — подрезать или удалить выступающую ленту, заполнить угол акриловым герметиком</li></ul><h3>Сопряжение разнородных материалов</h3><ul><li>На стыках бетон/газобетон — два слоя сетки; выпуск от шва 15 см в каждую сторону</li><li>Расшить и зачистить швы, заполнить монтажной пеной; рекомендуется лента STRAIT-FLEX</li><li>Для цементной штукатурки — металлическая сетка 20×20 мм с отступом от стены</li></ul><h3>Углы</h3><ul><li>Внутренние углы — стеклопластиковая сетка с выпуском 15 см в каждую сторону</li><li>Профиль оконного примыкания + угловой профиль PROFIGIPS в откосах</li><li>Порядок армирования углов проёмов: контактный слой → прямоугольник 20×40 см по диагонали → штукатурка → Г-образный элемент в каждом углу → штукатурка под маяк</li></ul>` } },
      { id:'applying-plaster', title: ml('Applying Plaster','Нанесение штукатурки','Shtukaturka qoʻllash','Gips çalmak','Сылақ жағу'), desc: ml('Plaster application methods','Методы нанесения штукатурки','Shtukaturka qoʻllash usullari','Gips çalmak usullary','Сылақ жағу әдістері'), content: { ru: `<h3>Виды штукатурки</h3><ul><li><b>Цементно-песчаная:</b> для помещений с повышенной влажностью (санузлы)</li><li><b>Гипсовая:</b> для остальных помещений; в санузлах — только с последующей гидроизоляцией (как KNAUF MP75)</li><li><b>KNAUF-GRUNBAND:</b> единственная ЦПШ для газобетона и штукатурки оконных откосов</li></ul><h3>Важно</h3><ul><li>Прочность основания должна быть больше прочности наносимого материала (СНиП 7.1.7.)</li><li>Слой более 50 мм — согласовать с руководителем; логичнее применить гипсокартон</li><li>После ЦПШ — на следующий день увлажнить поверхность для набора марочной прочности</li><li>Замес: сначала вода, затем штукатурка; ёмкость промывать после каждого замеса</li></ul><h3>Нанесение</h3><ul><li>Наносить шлепками равномерно между маяками, без пустот</li><li>Разравнивать H-образным правилом, подрезку — трапециевидным</li><li>Стягивать правилом сверху вниз — доводить до потолка, там чаще наплывы</li><li>На монтажную пену — слой не менее 2 см</li></ul><h3>Подрезка и завершение</h3><ul><li>Подрезка — когда штукатурка схватилась (не прилипает к пальцу), ~40 минут</li><li>Маяки удалить после подрезки: подцепить шпателем, вырвать пассатижами</li><li>Штробы заделать тем же составом с запасом, убрать лишнее при подрезке</li><li>Через 30 минут — финишная подрезка правилом; через 20 минут — обработка широким шпателем</li><li>Дать полностью высохнуть; применять осушители воздуха в центре помещения</li><li>Запрещено: тепловые пушки для сушки; начинать следующие работы до полного высыхания</li></ul>` } },
      { id:'plastered-slopes', title: ml('Plastered Slopes','Штукатурные откосы','Shtukaturka nishablar','Gipslenen eňňitmeler','Сылақталған еңістер'), desc: ml('Slope plastering techniques','Техники штукатурки откосов','Nishablarni shtukaturkalash texnikalari','Eňňitmeleri gipslemek usullary','Еңістерді сылақтау әдістері') },
      { id:'ceiling-plastering', title: ml('Ceiling Plastering','Штукатурка потолка','Shiftni shtukaturkalash','Potology gipslemek','Төбені сылақтау'), desc: ml('Ceiling plastering methods','Методы штукатурки потолка','Shiftni shtukaturkalash usullari','Potology gipslemek usullary','Төбені сылақтау әдістері'), content: { ru: `<h3>Важно</h3><ul><li>Штукатурка потолка компанией практически не применяется</li><li>Выполнять работы в паре — значительно тяжелее и сложнее, чем вертикальные основания</li><li>Не рекомендуется штукатурить потолки при толщине слоя более 15 мм</li><li>При слое более 15 мм — дополнительное армирование металлической оцинкованной сеткой</li><li>При слое около 30 мм — целесообразнее натяжной потолок</li><li>Если потолок из деталей перекрытий с соединениями — высокая вероятность трещин даже при двойном армировании</li></ul><h3>Подготовительные работы</h3><ul><li>Монолитный бетон — зачистить шлифмашиной, цементное молочко убрать</li><li>Определить уровень потолка и выступающие части стойкой и лазером</li><li>ЦСП и пенополистирол — штукатурить только с армированием сеткой 5×5 мм по всей поверхности</li><li>Последовательность: бетоноконтакт → ~5 мм штукатурки → сетка → маяки → штукатурка</li><li>По периметру — демпферная лента в точках сопряжения со стеной</li><li>Дополнительные «якори»: нарезать оцинкованные подвесы, пристрелить к потолку, отогнуть лапки</li></ul><h3>Стыки монолитного основания</h3><ul><li>Стык плит перекрытия: штукатурка → сетка 15 см → штукатурка → сетка 30 см → штукатурка под маяк</li><li>Внутренние углы фасадной стены: расшить, напылить утеплитель (POLYNOR); армировать аналогично</li></ul>` } },
      { id:'wall-plastering', title: ml('Wall Plastering','Штукатурка стен','Devorlarni shtukaturkalash','Diwarlary gipslemek','Қабырғаларды сылақтау'), desc: ml('Wall plastering techniques','Техники штукатурки стен','Devorlarni shtukaturkalash texnikalari','Diwarlary gipslemek usullary','Қабырғаларды сылақтау әдістері'), content: { ru: `<h3>Механизированная штукатурка</h3><p>Процесс подготовки основания, установка маяков и армирование не отличаются от ручного нанесения — только способ нанесения значительно ускоряет работу.</p><h3>Порядок нанесения (машинное нанесение)</h3><ul><li>Наносить раствор снизу вверх, пистолет вести горизонтально</li><li>Контролировать количество смеси в бункере</li><li>Разгладить H-образным правилом, добавить раствор в недостающие места</li><li>Выполнить подрезку поверхности</li><li>Замыть резиновой губкой, загладить широким шпателем</li><li>Достать маяки, замазать штробы (не делать бугры)</li></ul><h3>Уход за штукатурной станцией</h3><ul><li>Чистить станцию после каждой смены — не более 15 минут</li><li>Выработать весь раствор перед чисткой</li><li>Чистить: смесительную спираль, бункер и зону смешивания, все выводы трубок, растворный шланг (шарик 2 раза), пистолет (разобрать, прочистить все части)</li><li>Удалить пыль щёткой, протереть шланги влажной тряпкой</li><li>Водяные фильтры — при каждой чистке; воздушные фильтры — 1 раз в месяц</li></ul>` } },
      { id:'plastering-checklist', title: ml('Checklist','Чек-лист','Tekshiruv roʻyxati','Barlag sanawy','Тексеру тізімі'), desc: ml('Plastering verification checklist','Контрольный список штукатурных работ','Shtukaturka ishlarining tekshiruv roʻyxati','Gipsleme işleriniň barlag sanawy','Сылақтау жұмыстарының тексеру тізімі'), content: { ru: `<h3>Запрещено при штукатурке</h3><ul><li>Бетоноконтакт на немонолитных основаниях</li><li>Оставлять маяки в штукатурке</li><li>Оставлять разрывы армирования на стыках материалов</li><li>Штукатурить гипсокартон</li><li>Наносить второй слой до высыхания первого</li><li>Жёсткое примыкание без демпферных лент</li><li>Жёсткое примыкание штукатурки к откосам</li><li>Устанавливать маяки на сплошном слое (только точечно, шаг ≤30 см)</li></ul>` } },
      { id:'plastering-videos', title: ml('Video Tutorials','Видео уроки','Video darsliklar','Wideo sapaklar','Бейне сабақтар'), desc: ml('Plastering video tutorials','Видео уроки по штукатурке','Shtukaturka boʻyicha video darsliklar','Gipsleme boýunça wideo sapaklar','Сылақтау бойынша бейне сабақтар') },
      { id:'plastering-documentation', title: ml('Documentation','Документация','Hujjatlar','Resminamalar','Құжаттама'), desc: ml('Plastering technical documentation','Техническая документация по штукатурке','Shtukaturka boʻyicha texnik hujjatlar','Gipsleme boýunça tehniki resminamalar','Сылақтау бойынша техникалық құжаттама') }
    ]
  },
  {
    sort: 6, icon: '🪟',
    name: ml('Windows','Окна','Derazalar','Penjireler','Терезелер'),
    cards: [
      { id:'windows-sub', title: ml('Windows Overview','Окна обзор','Derazalar haqida','Penjireler hakynda','Терезелер туралы'), desc: ml('Window types and specifications','Типы и характеристики окон','Deraza turlari va xususiyatlari','Penjire görnüşleri we aýratynlyklary','Терезе түрлері және сипаттамалары') },
      { id:'window-installation', title: ml('Window Installation','Установка окон','Derazalarni oʻrnatish','Penjireleri ornaşdyrmak','Терезелерді орнату'), desc: ml('Window installation procedures','Процедуры установки окон','Derazalarni oʻrnatish tartiblari','Penjireleri ornaşdyrmak amallary','Терезелерді орнату рәсімдері'), content: { ru: `<p>Установку окон выполняют подрядные организации. Задача строителя — проверить качество установки.</p><h3>Стандарты</h3><ul><li>ГОСТ 23166-2021 (конструкции оконные)</li><li>ГОСТ 30971-2002 (монтажный шов)</li></ul><h3>Параметры установки</h3><ul><li>Первое крепление: 12–18 см от угла</li><li>Последующие крепления: максимум 70 см</li><li>Минимум 3 анкерных точки на вертикальную сторону</li><li>Минимум 2 на горизонтальную сторону</li></ul><h3>Тепловой удар (термошок)</h3><ul><li>Не класть утеплитель вплотную к стеклу</li><li>Не закрывать окно полностью при покраске</li><li>Оставлять вентиляционные зазоры при укрытии</li></ul><h3>Самостоятельный замер лишает гарантии производителя</h3><p>Для стандартных проёмов: ширина минус 30 мм, высота минус 50 мм. Подоконник: +100 мм к ширине проёма, максимальный выступ внутрь 6 см.</p>` } }
    ]
  },
  {
    sort: 7, icon: '🌡️',
    name: ml('Thermal Insulation','Теплоизоляция','Issiqlik izolyatsiyasi','Ýylylyk izolýasiýasy','Жылу оқшаулау'),
    cards: [
      { id:'balcony-insulation', title: ml('Balcony Insulation','Утепление балкона','Balkonni izolyatsiya qilish','Balkony izolýasiýa etmek','Балконды оқшаулау'), desc: ml('Balcony thermal insulation methods','Методы теплоизоляции балкона','Balkonni issiqlik izolyatsiyasi usullari','Balkonyň ýylylyk izolýasiýasy usullary','Балконды жылу оқшаулау әдістері'), content: { ru: `<h3>Материалы</h3><ul><li>РУСПАНЕЛЬ (применяется в компании) — многослойный материал, защищает от влаги и мостиков холода, армированный, готов к отделке</li><li>Клей-пена РУСПАНЕЛЬ или TYTAN — основной способ крепления</li><li>Штукатурно-клеевая смесь КНАУФ-СЕВЕНЕР или Mapei Mapetherm AR2</li><li>Укрепляющая грунтовка (Тифенгрунд), универсальная грунтовка (Мультигрунд)</li><li>Фасадная стеклопластиковая сетка 5×5 мм</li></ul><h3>Важно</h3><ul><li>Главная задача — добиться полной герметичности</li><li>Уделить особое внимание источникам мостиков холода</li><li>ПЕНОПЛЕКС и иные материалы с глянцем — создать шагрень для адгезии (шлифбумага зернистость 60/80)</li><li>РУСПАНЕЛЬ можно фрезеровать и изготавливать элементы различной формы</li></ul><h3>Монтаж</h3><ul><li>Нанести клей-пену на панель, прижать к основанию, выставить по лазерному уровню</li><li>Клинья для временной фиксации, малярная лента</li><li>После застывания — удалить излишки пены, заделать шов штукатурной смесью</li><li>Внешние углы армировать стеклопластиковой сеткой</li></ul>` } },
      { id:'slope-insulation', title: ml('Slope Insulation','Утепление откосов','Nishablarni izolyatsiya qilish','Eňňitmeleri izolýasiýa etmek','Еңістерді оқшаулау'), desc: ml('Slope thermal insulation techniques','Техники теплоизоляции откосов','Nishablarni issiqlik izolyatsiyasi texnikalari','Eňňitmeleriň ýylylyk izolýasiýasy usullary','Еңістерді жылу оқшаулау әдістері'), content: { ru: `<h3>Материал</h3><p>Для утепления откосов применяется РУСПАНЕЛЬ (экструдированный пенополистирол). Применяется, если толщина слоя и расположение петель стеклопакета позволяют.</p><h3>Последовательность</h3><p>Грунт → РУСПАНЕЛЬ → штукатурный слой с профилем оконного примыкания и угловым маячковым профилем.</p><h3>Монтаж</h3><ul><li>Снять размеры откосов с учётом углов рассвета; детали должны быть цельными</li><li>Сначала монтируются боковые вертикальные, затем верхний горизонтальный</li><li>Клей: КНАУФ-СЕВЕНЕР или Mapei MAPETHERM AR2 гребенчатым шпателем 6 мм; или клей-пена TYTAN/РУСПАНЕЛЬ (надёжность ниже)</li><li>Внешний угол выставить по лазерному уровню; клинья для позиционирования, фиксировать малярной лентой</li><li>После застывания — удалить излишки пены, заделать шов штукатурной смесью</li><li>Внешний угол армировать стеклопластиковой сеткой</li><li>Сопряжение с рамой — профиль оконного примыкания (или герметик)</li></ul>` } },
      { id:'liquid-insulation', title: ml('Liquid Insulation','Жидкая изоляция','Suyuq izolyatsiya','Suwuk izolýasiýa','Сұйық оқшаулау'), desc: ml('Liquid thermal insulation application','Применение жидкой теплоизоляции','Suyuq issiqlik izolyatsiyasini qoʻllash','Suwuk ýylylyk izolýasiýasyny ulanmak','Сұйық жылу оқшаулауды қолдану'), content: { ru: `<h3>Важно</h3><p>Жидкая теплоизоляция применяется только для металлических элементов и не может заменить утепление из экструдированного пенополистирола или минеральной ваты — только вспомогательный материал.</p><h3>Применяется для</h3><ul><li>Трубопроводов ХВС/ГВС — исключение конденсата и сохранение температуры</li><li>Паропроводов, воздуховодов кондиционирования</li><li>Различных металлических ёмкостей</li></ul><h3>Нанесение</h3><ul><li>Материалы: КОРУНД или ТЕРМИОН</li><li>Очистить и обезжирить поверхность; температура +7°С до +150°С</li><li>Наносить валиком, кистью или распылителем; каждый слой 0,3–0,5 мм (не толще — образует непроницаемую плёнку)</li><li>Расход кистью: 0,5 л/м² на один слой</li><li>Каждый последующий слой — не ранее чем через сутки после полного высыхания предыдущего</li></ul><h3>Чек-лист</h3><ul><li>Основной слой плотный и непрерывный, без отслоений и пустот</li><li>Поверхность ровная, без трещин, провисаний и сползаний</li><li>Толщину проверять толщиномером в нескольких точках</li></ul>` } }

      { id:'plaster-slopes', title: ml('Plaster Slopes','Штукатурные откосы','Shtukaturka nishablar','Gipsleme eňňitmeleri','Сылақ еңістері'), desc: ml('Plastered slope finishing','Отделка штукатурных откосов','Shtukaturka nishablarni bezash','Gipsleme eňňitmelerini bezemek','Сылақ еңістерін әрлеу'), content: { ru: `<h3>Требования к материалам откосов</h3><ul><li>Устойчивость к высокой влажности и перепадам температур</li><li>Особое внимание конструктивной герметизации</li><li>Экологически безопасные материалы для внутренней установки</li><li>Лёгкость в обслуживании и стандартной уборке</li></ul><p><b>Неправильная установка</b> приводит к потере тепла до 40%.</p><h3>Типы откосов</h3><ul><li>Штукатурные откосы</li><li>Откосы из гипсокартона</li><li>Сэндвич-панели (не применяются)</li></ul>` } },
      { id:'gypsum-slopes', title: ml('Gypsum Slopes','Гипсовые откосы','Gipsli nishablar','Gips eňňitmeleri','Гипс еңістері'), desc: ml('Gypsum board slope installation','Установка гипсовых откосов','Gipsli nishablarni oʻrnatish','Gips eňňitmelerini ornaşdyrmak','Гипс еңістерін орнату'), content: { ru: `<h3>Важно</h3><ul><li>Устанавливать откосы из ГКЛ после штукатурных работ</li><li>Упаковать окна и подоконник согласно регламенту</li></ul><h3>Материалы</h3><ul><li>Влагостойкий гипсокартон 12,5 мм (например GYPROC)</li><li>Минеральный клей для гипсокартона (бескаркасный монтаж)</li><li>Профессиональная монтажная пена, клинья</li><li>Опорные пластины из ламината, фанеры или кварцвинила с двусторонним скотчем</li></ul><h3>Подготовка</html><ul><li>Очистить и загрунтовать черновые откосы</li><li>Раскроить ГКЛ с запасом 1–2 см за плоскость стены; обработать торец кромочным рубанком (указать стрелкой к раме)</li><li>Подготовить опорные пластины, приклеить к раме по лазерному лучу</li></ul><h3>Монтаж вертикальных откосов</h3><ul><li>Отмерить угол рассвета (обычно 2–4 см отклонения на ширину откоса)</li><li>Лазером задать ось от полученной отметки; приклеить опорные пластины к раме</li><li>Нанести клей для ГКЛ точечно-шлепками по лучу; приклеить откос торцом к раме, выставить по лазеру и уровню</li><li>После застывания клея — нанести монтажную пену в пространство между откосом и стеной (без избытка)</li><li>Зафиксировать край малярным скотчем по плоскости стены; после застывания пены — убрать скотч, срезать излишки</li></ul><h3>Монтаж горизонтальных откосов</h3><ul><li>Аналогично вертикальным; центральную часть притянуть саморезами к заранее установленной фанере</li><li>После заполнения пеной — зафиксировать малярным скотчем</li><li>Заполнить штукатурным составом щель между стеной и откосами</li><li>После застывания — срезать выступающие излишки ГКЛ по плоскости стены ножом</li></ul>` } },
      { id:'sandwich-panels', title: ml('Sandwich Panels','Сэндвич-панели','Sendvich panellar','Sendwiç paneller','Сэндвич панельдер'), desc: ml('Sandwich panel slope installation','Установка откосов из сэндвич-панелей','Sendvich panelli nishablarni oʻrnatish','Sendwiç panelli eňňitmeleri ornaşdyrmak','Сэндвич панельді еңістерді орнату') },

  {

    name: ml('Plumbing','Сантехника','Santexnika','Santehnika','Сантехника'),
    cards: [
      { id:'water-risers', title: ml('Water Risers','Водяные стояки','Suv stoyaklari','Suw stoýaklary','Су стояктары'), desc: ml('Water riser installation and replacement','Установка и замена водяных стояков','Suv stoyaklarini oʻrnatish va almashtirish','Suw stoýaklaryny ornaşdyrmak we çalyşmak','Су стояктарын орнату және ауыстыру'), content: { ru: `<h3>Разделы сантехники и отопления</h3><ul><li>Стояки ХВС и ГВС, канализация, звукоизоляция, штробление</li><li>Монтаж труб водоснабжения и отопления</li><li>Сантехнический шкаф</li><li>Система защиты от протечек и КУП</li><li>Уплотнение резьбовых соединений</li><li>Отопление и опрессовка</li><li>Требования к сантехникам</li></ul>` } },
      { id:'pipe-installation', title: ml('Pipe Installation','Установка труб','Trubalarni oʻrnatish','Turbalary ornaşdyrmak','Құбырларды орнату'), desc: ml('Pipe routing and installation methods','Методы прокладки и установки труб','Trubalarni yoʻnaltirish va oʻrnatish usullari','Turbalary ugratmak we ornaşdyrmak usullary','Құбырларды бағыттау және орнату әдістері'), content: { ru: `<h3>Монтаж труб по полу (к мембране)</h3><ul><li>Прокладывать линии с расстоянием между ними — чтобы раствор стяжки заполнял пустоты</li><li>Плотный шлейф без расстояния → риск трещин в стяжке</li><li>Запрещено пробивать и прорезать битумно-войлочную мембрану — создаёт мостики шума</li><li>Для кабелей по полу — гофра ПНД (ДКС оранжевая/чёрная) или негорючая серая</li></ul><h3>Способы крепления трассы к мембране</h3><ul><li><b>Металлическая сетка + хомуты</b> — основной способ; трасса лежит свободно, раствор заполняет пустоты</li><li><b>Двусторонний скотч</b> — мембрану предварительно помыть, очистить, обезжирить</li><li><b>Клеевой пистолет</b> — клипсы приклеиваются к основанию мембраны</li><li><b>Кровельный скотч поверх трассы</b> — не наносит повреждений мембране</li><li><b>Прямой монтаж газовым пистолетом</b> — только в исключительных случаях; точки крепления промазать гидроизоляционной мастикой</li></ul><h3>Монтаж водорозеток</h3><ul><li>Все водорозетки закрепляются на специальных шинах, утопленных в стены</li><li>Зоны штробы предварительно обработать гидроизоляционной мастикой</li><li>Глубина штробы: труба с утеплителем полностью утапливается, не выступает за плоскость штукатурки</li><li>Стандартная высота душевой стойки: 1200 мм от пола, 150 мм между осями (если иное не предусмотрено проектом)</li><li>Удлинители на резьбу водорозетки упрощают выставление по уровню</li></ul><h3>Монтаж инсталляции</h3><ul><li>Проверить раскладку плитки — кнопки и управление должны иметь корректные примыкания</li><li>Высота установки унитаза — 450 мм от уровня чистового пола</li><li>Выровнять по уровню горизонтально и вертикально перед монтажом</li><li>Закрепить минимум в 4 точках: 2 на ножках к основанию, 2 на верхней части шпильками</li></ul>` } },
      { id:'plumbing-cabinet', title: ml('Plumbing Cabinet','Сантехнический шкаф','Santexnika shkafi','Santehnika şkafy','Сантехника шкафы'), desc: ml('Plumbing cabinet installation','Установка сантехнического шкафа','Santexnika shkafini oʻrnatish','Santehnika şkafyny ornaşdyrmak','Сантехника шкафын орнату'), content: { ru: `<h3>Общие требования</h3><ul><li>Сборка коллектора — только по лучевой схеме (не последовательной)</li><li>Задняя стенка шкафа — металлический алюминиевый лист</li><li>Обязательна подсветка внутри шкафа</li><li>Предусмотреть сифон для сброса конденсата от кондиционеров</li><li>Рекомендуется каркас из профиля TECE, зашитый ГВЛ — максимально монолитная конструкция</li><li>Самопромывной фильтр тонкой очистки — подключить к сухому затвору канализации</li></ul><h3>Стандартный коллекторный узел включает</h3><ul><li><b>Вводной шаровой кран</b> (рекомендуется OVENTROP — не закисает)</li><li><b>Кран системы защиты от протечек NEPTUN</b> с электроприводом</li><li><b>Фильтр грубой очистки (косой)</b> FAR 300 мкм; учитывать направление потока</li><li><b>Редуктор давления с манометром</b> FAR</li><li><b>Счётчики ХВС/ГВС</b></li><li><b>Обратный клапан</b></li><li><b>Самопромывной фильтр тонкой очистки</b> FAR 100 мкм с манометром; вывод промывки — в канализацию через сифон с сухим затвором</li><li><b>Коллектор FAR</b> — распределение по потребителям</li><li><b>Компенсатор гидроударов FAR</b></li></ul><h3>Система защиты от протечек</h3><ul><li>Применять беспроводные датчики — удобнее, срок службы батарей >10 лет</li><li>Полка в шкафу с герметизированными проходами труб — при протечке вода течёт по трубам на полку с датчиком</li><li>Если блок управления в электрощите — дисплей совместить с пластроном щита</li></ul><h3>Система уравнивания потенциалов (КУП)</h3><ul><li>Подключить от щита кабелем ≥6 мм²; для металлических конструкций — кабель ≥6 мм²</li><li>Заземлить: коллекторы отопления, трубы ХВС/ГВС, металлические каркасы, ванну/поддон, короба вентиляции</li><li>Если PE-проводника нет — подготовить КУП, но не подключать до реконструкции</li><li>Запрещено разделять нулевой кабель на PE и рабочий ноль в подъездном щите если нет отдельного PE</li></ul>` } },
      { id:'threaded-joints', title: ml('Threaded Joints','Резьбовые соединения','Rezьbali biriktirishlar','Ýüpli birikdirmeler','Бұрандалы қосылыстар'), desc: ml('Threaded joint assembly techniques','Техники сборки резьбовых соединений','Rezьbali birikmalarni yigʻish texnikalari','Ýüpli birikdirmeleri ýygnamak usullary','Бұрандалы қосылыстарды құрастыру әдістері'), content: { ru: `<h3>Подготовка</h3><p>На внешней резьбе всех элементов накатать насечки специальным инструментом — для сцепления уплотнителя с металлом.</p><h3>Виды уплотнителей</h3><ul><li><b>Лён + паста (AQUAFLEX NANO):</b> намотать по часовой стрелке от начала резьбы, больше половины длины резьбы; паста наносится равномерно поверх льна. Требует минимальных навыков.</li><li><b>Анаэробный герметик:</b> обезжирить резьбу спиртом, нанести на 60–70% площади резьбы; затвердевает при отсутствии доступа воздуха. Закручивается от руки. Запрещено для полимерной резьбы. Для разборки — нагреть феном до 140°С.</li><li><b>Сантехническая нить (полиамид):</b> синтетический уплотнитель, не стареет на резьбе; позволяет открутить соединение до 180° без потери герметичности. Требует опыта.</li><li><b>ФУМ лента:</b> ширина 10–12 мм для жилых объектов; невозможно открутить без потери герметичности — придётся пересобирать при любой коррекции.</li></ul><h3>Отопление — важно</h3><ul><li>Труба от коллектора до радиатора — цельная без соединений и переходников</li><li>Перед монтажом радиаторов стены должны быть оштукатурены</li><li>Теплоизоляция труб выходит из стены; после финишной штукатурки — подрезать и заделать герметиком</li><li>Узел примыкания заполнять герметиком или монтажной пеной, не штукатуркой</li><li>Рекомендуется применять трубы REHAU RAUTITAN или TECE</li><li>Зазор радиатора от пола и подоконника — не менее 10 см</li></ul>` } },
      { id:'plumber-requirements', title: ml('Plumber Requirements','Требования к сантехнику','Santexnikka talablar','Santehnikçä talaplar','Сантехникке талаптар'), desc: ml('Professional requirements for plumbers','Профессиональные требования к сантехникам','Santexniklarga professional talablar','Santehnikçilere hünärli talaplar','Сантехниктерге кәсіби талаптар'), content: { ru: `<h3>Общие требования</h3><ul><li>Рабочий день с 9:00 до 19:00; распитие спиртных напитков и курение на объекте запрещено</li><li>Ежедневная уборка перед уходом; мусор складировать строго в отведённое место</li><li>Запрещено засорять канализацию строительным мусором (цемент, ГКЛ, полиэтилен, краска)</li><li>Передача ключей третьим лицам запрещена — штраф 3000 руб.</li><li>Материалы комплектовать за 1 неделю до начала работ</li></ul><h3>Выполнение работ</h3><ul><li>Перед началом составить схему прокладки труб, согласовать — нет ли пересечений воды и канализации</li><li>При установке инсталляции — проверить раскладку плитки: кнопки и краны не должны попадать на рельеф</li><li>Сливной трап в душевой: уклон минимальный для трубы 50 мм — 3 см на 1 метр</li><li>Запрещены резьбовые соединения в заливных полах и в заделываемых стенах</li><li>Декоративные элементы (сливные трапы, радиаторы, унитазы, биде) монтировать не ранее чем за 2 дня до сдачи</li><li>Напольные унитазы и биде надёжно закрепить, герметизировать швы</li></ul><h3>Этапы приёмки</h3><ul><li><b>Этап 1:</b> Прокладка всех трасс отопления, ХВС, ГВС, канализации — проверка протечек тактильно; 10 л воды в каждое сливное отверстие; проверить горячую/холодную не перепутаны</li><li><b>Этап 2:</b> Установка фильтров, радиаторов, запорных кранов</li><li><b>Этап 3:</b> Финишная сантехника за 2 дня до сдачи</li><li>После каждого этапа — акт приёмки с датой и подписью ответственного</li></ul>` } },
      { id:'plumbing-materials', title: ml('Materials','Материалы','Materiallar','Materiallar','Материалдар'), desc: ml('Plumbing materials overview','Обзор сантехнических материалов','Santexnika materiallariga umumiy koʻrinish','Santehnika materiallaryna syn','Сантехника материалдарына шолу'), content: { ru: `<h3>Очистка сантехники после монтажа — NEOMID 560</h3><p>Средство для удаления цементных остатков, извести и гипсовых пятен.</p><h3>Разведение по степени загрязнения</h3><ul><li>Застарелые отложения: без разведения</li><li>Общие строительные остатки: 1:5 до 1:10</li><li>Налёт жёсткой воды: 1:10</li></ul><h3>Применение</h3><ul><li>Предварительно смочить поверхность водой</li><li>Нанести обильно, выдержать 3–5 минут</li><li>Протереть губкой или щёткой, смыть водой</li><li>Не оставлять на поверхности до высыхания</li></ul>` } },
      { id:'plumbing-documentation', title: ml('Documentation','Документация','Hujjatlar','Resminamalar','Құжаттама'), desc: ml('Plumbing technical documentation','Техническая документация по сантехнике','Santexnika boʻyicha texnik hujjatlar','Santehnika boýunça tehniki resminamalar','Сантехника бойынша техникалық құжаттама') },
      { id:'plumbing-videos', title: ml('Video Tutorials','Видео уроки','Video darsliklar','Wideo sapaklar','Бейне сабақтар'), desc: ml('Plumbing video tutorials','Видео уроки по сантехнике','Santexnika boʻyicha video darsliklar','Santehnika boýunça wideo sapaklar','Сантехника бойынша бейне сабақтар') },
      { id:'plumbing-checklist', title: ml('Checklist','Чек-лист','Tekshiruv roʻyxati','Barlag sanawy','Тексеру тізімі'), desc: ml('Plumbing verification checklist','Контрольный список сантехнических работ','Santexnika ishlarining tekshiruv roʻyxati','Santehnika işleriniň barlag sanawy','Сантехника жұмыстарының тексеру тізімі'), content: { ru: `<h3>Общие требования</h3><ul><li>На объекте чисто, чистовые материалы не повреждены, мусор в одном месте</li></ul><h3>Водорозетки</h3><ul><li>Положение водорозеток и канализации соответствует проекту</li><li>Водорозетки выставлены строго перпендикулярно плоскости стены</li></ul><h3>Канализация</h3><ul><li>Уклон трубы 110 мм: 20 мм на 1 пог. м (СНиП 2.04.01-85 п.18.2)</li><li>Уклон трубы 50 мм: 30 мм на 1 пог. м</li><li>Вылить не менее 10 л воды в каждое сливное отверстие</li></ul><h3>Водоснабжение</h3><ul><li>Подвод воды к каждому потребителю — цельной неразрывной трубой</li><li>К проточному водонагревателю подведён питающий кабель</li><li>Соединение трубы в коллекторе — с декоративным соединительным колпачком</li><li>Все трубы в теплоизоляции: горячая — красная, холодная — синяя</li><li>Каждая труба промаркирована с названием потребителя</li><li>Предусмотрен фильтр тонкой очистки</li><li>Вывод труб: слева ГВС, справа ХВС (при термостатическом кране — по инструкции)</li><li>Трасса более 16 м до потребителя — труба диаметром более 20 мм</li></ul><h3>Коллекторный узел</h3><ul><li>Обеспечен доступ к каждому элементу с учётом будущего люка ревизии</li><li>Установлена подсветка</li><li>После монтажа гребёнки — выровнена плоскость в шахте пеноплексом/пеной ниже уровня надписей гребёнки</li><li>Предоставить ламинированную схему коллекторного узла с инструкцией по эксплуатации</li></ul><h3>Отопление</h3><ul><li>Радиаторы проверить на механические повреждения, пронумеровать</li><li>Оставлять зазор под шпаклёвку и покраску при установке радиаторов</li><li>Защитить радиаторы от грязи и пыли</li></ul>` } }
    ]
  },
  {
    sort: 10, icon: '🔇',
    name: ml('Soundproofing','Звукоизоляция','Ovoz izolyatsiyasi','Ses izolýasiýasy','Дыбыс оқшаулау'),
    cards: [
      { id:'wall-soundproofing', title: ml('Wall Soundproofing','Звукоизоляция стен','Devorlar ovoz izolyatsiyasi','Diwarlaryň ses izolýasiýasy','Қабырғалардың дыбыс оқшаулауы'), desc: ml('Wall acoustic insulation methods','Методы акустической изоляции стен','Devorlarning akustik izolyatsiya usullari','Diwarlaryň akustiki izolýasiýa usullary','Қабырғалардың акустикалық оқшаулау әдістері'), content: { ru: `<h3>Три вида шума</h3><ul><li><b>Воздушный:</b> музыка, разговоры, телевизор</li><li><b>Ударный:</b> движение мебели, падение предметов, прыжки</li><li><b>Структурный:</b> передача через прилегающие конструкции здания</li></ul><h3>Факторы качественной звукоизоляции</h3><ul><li>Масса конструкции</li><li>Виброизоляция</li><li>Звукопоглощение</li><li>Целостность герметизации</li></ul><h3>Виды монтажа</h3><ul><li><b>Безрамный:</b> крепится непосредственно к основанию</li><li><b>Каркасный:</b> монтируется на каркасе</li></ul><h3>Полная звукоизоляция</h3><p>Требует принципа «комната в комнате» для защиты от всех трёх видов шума.</p>` } },
      { id:'floor-soundproofing', title: ml('Floor Soundproofing','Звукоизоляция пола','Pol ovoz izolyatsiyasi','Poluň ses izolýasiýasy','Еденнің дыбыс оқшаулауы'), desc: ml('Floor acoustic insulation methods','Методы акустической изоляции пола','Polning akustik izolyatsiya usullari','Poluň akustiki izolýasiýa usullary','Еденнің акустикалық оқшаулау әдістері'), content: { ru: `<h3>Виды шумоизоляции пола (по эффективности)</h3><ul><li>Битумно-войлочные мембраны — базовый уровень</li><li>THERMOZZVUKOIZOL и мембраны с войлочным слоем — улучшенный уровень</li><li>Базальтовые плиты — наиболее эффективный вариант</li><li>Комбинированная (битумно-войлочная + базальт) — максимальная защита</li></ul>` } },
      { id:'ceiling-soundproofing', title: ml('Ceiling Soundproofing','Звукоизоляция потолка','Shift ovoz izolyatsiyasi','Potologyň ses izolýasiýasy','Төбенің дыбыс оқшаулауы'), desc: ml('Ceiling acoustic insulation methods','Методы акустической изоляции потолка','Shiftning akustik izolyatsiya usullari','Potologyň akustiki izolýasiýa usullary','Төбенің акустикалық оқшаулау әдістері'), content: { ru: `<h3>Важно</h3><p>Подходящие решения подбираются индивидуально исходя из поставленных задач. Виброподвесы выполняют функцию виброразвязки между основанием и каркасом — они отличаются от обычных подвесов наличием вставки из эластомера.</p><h3>Бескаркасная звукоизоляция потолка</h3><ul><li>Монтаж начинается с демпфирующей ленты ТЕХНОСОНУС СтопЗвук V-100 в два слоя на герметик</li><li>Элементы АКУСТИК ГИПС BASIC герметизируются виброакустическим герметиком, крепятся виброшайбами</li><li>Все швы и стыки обрабатываются виброакустическим герметиком СОНЕТИК</li><li>Применять подъёмник для ГКЛ при работах с потолком</li></ul><h3>Монтаж ТЕРМОЗВУКОИЗОЛ на потолок</h3><ul><li>Поверхности очистить от пыли и загрунтовать</li><li>Оптимальная температура для склеивания 18±5°С, не ниже 10°С</li><li>Время высыхания 2–3 часа</li><li>Нанести клей BAUTGER валиком, приклеить листы ТЗИ внахлёст 5–10 см</li><li>Резаный край проклеить армированным скотчем</li><li>Разводка электрики по потолку выполняется строго после монтажа ТЗИ</li></ul><h3>Каркасная звукоизоляция потолка (базовая)</h3><ul><li>Лента СтопЗвук V-100 — в два раза больше длины стены, сложить вдвое, приклеить к стенам на герметик</li><li>Приклеить ТЗИ на потолок согласно технологии</li><li>Закрепить направляющий профиль через ленту V100 с шагом 250–300 мм, использовать виброшайбы</li><li>Виброподвесы: шаг 400 мм поперёк и 600 мм вдоль помещения</li><li>Заполнить ячейки каркаса плитами СтопЗвук БП, оклеить лентой DB</li><li>Зашить двумя слоями АкустикГипс ГКЛЗ перпендикулярно, обработать стыки герметиком</li><li>Удалить излишки ленты V100, периметр обработать герметиком СОНЕТИК</li></ul><h3>Звукоизоляция под натяжной потолок (Эконом)</h3><ul><li>Нарезать мембрану Тексаунд на полосы, нанести клей BAUTGER валиком</li><li>Приклеить внахлёст 5–10 см, дополнительно закрепить тарельчатым дюбель-гвоздём</li><li>Проклеить стыки армированной лентой</li></ul>` } },
      { id:'pipe-soundproofing', title: ml('Pipe Soundproofing','Звукоизоляция труб','Trubalar ovoz izolyatsiyasi','Turbalaryň ses izolýasiýasy','Құбырлардың дыбыс оқшаулауы'), desc: ml('Pipe acoustic insulation methods','Методы акустической изоляции труб','Trubalarning akustik izolyatsiya usullari','Turbalaryň akustiki izolýasiýa usullary','Құбырлардың акустикалық оқшаулау әдістері'), content: { ru: `<h3>Звукоизоляция труб</h3><p>Лучший результат даёт комплексное применение звукоизоляционных труб со звукоизолирующим материалом поверх. Применять готовый комплект от Техносонус или автомобильную шумоизоляцию STP.</p><ul><li>Очистить поверхность трубы от загрязнений и конденсата — она должна быть сухой</li><li>Для крепления канализационного стояка использовать хомуты с резиновыми вставками и демпфирующими прокладками</li><li>Снять защитный слой со звукоизоляционного листа, приклеить клеевой стороной, дополнительно зафиксировать пластиковыми стяжками</li><li>После монтажа все стыки и швы проклеить армирующей лентой</li></ul><h3>Звукоизоляция сквозных гильз стояков отопления и водоснабжения</h3><ul><li>Очистить гильзу от пыли и грязи, обезжирить</li><li>Плотно забить в несколько витков противопожарный асбестовый шнур</li><li>Сверху нанести звукоизоляционный герметик (например, ВИБРОСИЛ)</li></ul><h3>Звукоизоляция трековых светильников</h3><ul><li>Измерить посадочные размеры светильников, фрезеровать акустический ГКЛ с запасом 5 мм с каждой стороны</li><li>Собрать короб на клей-пену, снаружи оклеить мембраной TECHNOSONUS Звукоизол ВЭМ</li><li>Смонтировать на виброакустический герметик, все стыки обработать герметиком</li><li>Отверстия для кабелей герметизировать после укладки кабеля</li><li>Саморезы закручивать перпендикулярно потолку или в сторону от шинопровода — не в сторону центра</li></ul>` } },
      { id:'soundproofing-documentation', title: ml('Documentation','Документация','Hujjatlar','Resminamalar','Құжаттама'), desc: ml('Soundproofing technical documentation','Техническая документация по звукоизоляции','Ovoz izolyatsiyasi boʻyicha texnik hujjatlar','Ses izolýasiýasy boýunça tehniki resminamalar','Дыбыс оқшаулау бойынша техникалық құжаттама') },
      { id:'soundproofing-videos', title: ml('Video Tutorials','Видео уроки','Video darsliklar','Wideo sapaklar','Бейне сабақтар'), desc: ml('Soundproofing video tutorials','Видео уроки по звукоизоляции','Ovoz izolyatsiyasi boʻyicha video darsliklar','Ses izolýasiýasy boýunça wideo sapaklar','Дыбыс оқшаулау бойынша бейне сабақтар') }
    ]

  {
    sort: 11, icon: '💡',
    name: ml('Electrical Installation','Электромонтаж','Elektromontaj','Elektromontaj','Электр монтаждау'),
    cards: [
      { id:'socket-installation', title: ml('Socket Installation','Установка розеток','Rozetkalarni oʻrnatish','Rozetkalary ornaşdyrmak','Розеткаларды орнату'), desc: ml('Electrical socket installation procedures','Процедуры установки электрических розеток','Elektr rozetkalarini oʻrnatish tartiblari','Elektrik rozetkalaryny ornaşdyrmak amallary','Электр розеткаларын орнату рәсімдері'), content: { ru: `<h3>Общие требования</h3><ul><li>Учитывать толщину напольных покрытий при выставлении уровней подрозетников</li><li>Учитывать ширину наличников дверей при планировании розеток и выключателей</li><li>В местах, где нет возможности установить подрозетник сразу — зафиксировать кабель на фото с линейкой</li><li>Удалить наклейки с чашек подрозетников перед установкой</li><li>Применять глубокие подрозетники (65 мм) для коммутации без распределительных коробок</li></ul><h3>Подготовка</h3><ul><li>Если заглушки отсутствуют — изготовить из пенополистирола коронкой нужного диаметра</li><li>Удалить заглушки ввода/вывода кабеля внутри подрозетника заранее</li><li>Вложить подрозетник в отверстие, проверить плоскость широким шпателем</li><li>Рекомендуются подрозетники KOPOS — герметичны, с оригинальными заглушками</li></ul><h3>Монтаж подрозетника</h3><ul><li>Обеспылить и увлажнить отверстие (садовым опрыскивателем или загрунтовать)</li><li>Материал: гипсовая смесь KNAUF ROTBAND (цементная штукатурка — цементный состав или плиточный клей)</li><li>Нанести смесь по краям отверстия и тонким слоем на чашки подрозетника</li><li>Аккуратно вставить, убрать лишний материал шпателем, выставить по уровню и разметке</li><li>Передняя часть подрозетника не должна выступать за плоскость стены</li><li>Проверить уровень от чистового пола по всему помещению лазерным уровнем</li></ul><h3>После установки</h3><ul><li>Дать раствору полностью высохнуть</li><li>Закрыть подрозетники заглушками KOPOS, открытые выводы кабелей свернуть и замотать плёнкой</li><li>Очистить подрозетники от остатков раствора (ёршик в шуруповёрте)</li><li>Рекомендуются противопожарные наклейки ОГНЕБОРЕЦ внутри на верхней части</li></ul>` } },
      { id:'cable-installation', title: ml('Cable Installation','Прокладка кабеля','Kabelni yoʻnaltirish','Kabeli ugratmak','Кабельді бағыттау'), desc: ml('Electrical cable routing and installation','Прокладка и установка электрических кабелей','Elektr kabellarini yoʻnaltirish va oʻrnatish','Elektrik kabellerini ugratmak we ornaşdyrmak','Электр кабельдерін бағыттау және орнату'), content: { ru: `<h3>Разделы электромонтажных работ</h3><ul><li>Монтаж подрозетников</li><li>Монтаж кабеля</li><li>Зачистка кабеля, соединение и коммутация проводников</li><li>Электрощит — монтаж</li><li>Заделка штробы</li><li>Материал и инструмент</li></ul>` } },
      { id:'cable-connections', title: ml('Cable Connections','Соединения кабелей','Kabel ulanishlari','Kabel birikdirmeleri','Кабель қосылыстары'), desc: ml('Cable connection and termination methods','Методы соединения и оконцевания кабелей','Kabellarni ulash va tugatish usullari','Kabelleri birikdirmek we tamamlamak usullary','Кабельдерді қосу және аяқтау әдістері'), content: { ru: `<h3>Общие требования</h3><ul><li>Коммутация по умолчанию в распределительных коробках на потолке; в подрозетниках применяется редко</li><li>Основной способ — опрессовка гильзами ГМЛ (наиболее быстрый и надёжный)</li><li>Место соединения изолировать термоусадочной трубкой с клеевым слоем</li><li>Распределительные коробки монтируются только на потолке, не в стенах</li></ul><h3>Запрещено</h3><ul><li>Соединять заземляющий проводник методом шлейфа внутри блока розеток</li><li>Паять заземляющий PE-проводник</li><li>Прямое соединение медного и алюминиевого проводника (только через болт с гайкой, шину или пружинную клемму)</li></ul><h3>Зачистка кабеля</h3><ul><li>Снятие изоляции — стрипперами или ножами с пяткой (FELO, KNIPEX)</li><li>Длина зачистки соответствует требованиям приборов (обычно 11 мм для розеток)</li><li>Оголённые концы жил не должны быть видны при подключении</li><li>Рекомендуется стриппер «книжка» для круглых и плоских кабелей</li></ul><h3>Опрессовка гильзами ГМЛ</h3><ul><li>Применять гильзы от КВТ: 4 мм² — для двух жил 1,5 мм², 6 мм² — для трёх жил 2,5 мм²</li><li>Жилы должны плотно входить в гильзу, пустоты заполнять обрезками проводников</li><li>Опрессовать пресс-клещами в 3–4 точках, надеть клеевую термоусадку</li><li>Нагреть феном, кончик прижать пассатижами — клей вышел наружу</li></ul><h3>Клеммники WAGO</h3><ul><li>Допускаются в подрозетниках (открытый доступ) и для небольших сечений (освещение)</li><li>В распределительных коробках (скрытое соединение) — только опрессовка, пайка или сварка</li><li>Зачистить жилы на длину, указанную на клеммнике</li></ul>` } },
      { id:'switchboard', title: ml('Switchboard','Электрощит','Elektr shchiti','Elektrik şiti','Электр қалқаны'), desc: ml('Switchboard assembly and installation','Сборка и установка электрощита','Elektr shchitini yigʻish va oʻrnatish','Elektrik şitini ýygnamak we ornaşdyrmak','Электр қалқанын құрастыру және орнату'), content: { ru: `<h3>Общие требования</h3><ul><li>Использовать только кабель по ГОСТ (не по ТУ)</li><li>Щит должен быть собран аккуратно и безопасно, обеспечивать удобное обслуживание</li><li>Кабели входят в щит с внешней изоляцией</li><li>Рекомендуется установить 2 пустые трубы-закладные для ввода будущих кабелей</li><li>Перед первым запуском — прозвонить щит и проверить на межфазное КЗ</li></ul><h3>Номиналы автоматов по сечению кабеля</h3><ul><li>1,5 мм² — 10 А</li><li>2,5 мм² — 16 А (25–32 А категорически запрещено)</li><li>4 мм² — 20 А</li><li>6 мм² — 32 А (иногда 25 А)</li><li>10 мм² — 50 А (иногда 40 А)</li><li>16 мм² — 65 А</li></ul><h3>Устройства защиты</h3><ul><li><b>УЗО</b> — защита от тока утечки (10 mA или 30 mA), не защищает от КЗ; каждое УЗО — на свою нулевую шину</li><li><b>Диф.автомат</b> — совмещает автомат и УЗО, применяется на одну линию; только двухмодульные</li><li><b>Реле напряжения</b> — защита от скачков; рекомендуется устанавливать по умолчанию</li><li>Противопожарное УЗО 300 mA (лучше селективное)</li></ul><h3>Основные ошибки</h3><ul><li>Сборка без УЗО</li><li>Неправильная затяжка клемм (нужна динамометрическая отвёртка, 2–3,5 Нм)</li><li>Три проводника в клемму одного автомата</li><li>Многожильный кабель без опрессовки НШВИ наконечниками</li><li>Неравномерное распределение нагрузки по фазам</li><li>Подключение нескольких УЗО на общую нулевую шину</li><li>Многожильный и одножильный проводник в одну клемму</li></ul><h3>Монтаж щита</h3><ul><li>Установка в нишу на гипсовый раствор или пену (только при невозможности на раствор)</li><li>Упаковать щит картоном с прорезью для вводного автомата, заклеить малярным скотчем</li></ul>` } },
      { id:'wall-chasing', title: ml('Wall Chasing','Штробление стен','Devorlarni shtrobish','Diwarlary ştroblamak','Қабырғаларды штробтау'), desc: ml('Creating channels in walls for cables','Создание каналов в стенах для кабелей','Kabellar uchun devorlarda kanallar yaratish','Kabeller üçin diwarlarda kanallary döretmek','Кабельдер үшін қабырғаларда арналар жасау'), content: { ru: `<h3>Важно</h3><p>Заделка штроб выполняется мастерами по штукатурным работам. Любая штроба — потенциальное место трещин из-за температурных расширений.</p><h3>Подготовка. Фаска. Грунтовка</h3><ul><li>Снять небольшую фаску с острых углов штробы зачистным шпателем — это снижает риск трещин</li><li>Наносить грунт и снимать фаску до укладки кабеля в штробу</li><li>Увлажнить участки стены рядом со штробой валиком перед грунтованием</li><li>Применять плёночный грунт КНАУФ-МУЛЬТИГРУНД</li><li>Подтёки грунта на стене убирать влажной тканью</li><li>Нанесение грунта — кистью или распылителем (распылитель значительно ускоряет работу)</li><li>Дать грунту полностью высохнуть согласно инструкции</li></ul><h3>Заполнение штробы</h3><ul><li>Заполнять тем же составом, что и штукатурка стен</li><li>Кабель или гофра должны быть утоплены минимум на 1 см от поверхности штукатурного слоя</li><li>Раствор не должен быть жидким — он должен плотно забиваться в полости</li><li><b>Вариант 1 (кабель зафиксирован):</b> тщательно вдавливать раствор под гофру или кабель</li><li><b>Вариант 2 (кабель можно отодвинуть):</b> отодвинуть кабель, забить штробу раствором, вдавить кабель, закрыть сверху — кабель полностью в теле раствора</li><li>На следующий день заполнить плоскость штробы более жидким составом по плоскости стены</li></ul>` } },
      { id:'electrical-materials', title: ml('Materials','Материалы','Materiallar','Materiallar','Материалдар'), desc: ml('Electrical materials overview','Обзор электрических материалов','Elektr materiallariga umumiy koʻrinish','Elektrik materiallaryna syn','Электр материалдарына шолу') },
      { id:'electrical-documentation', title: ml('Documentation','Документация','Hujjatlar','Resminamalar','Құжаттама'), desc: ml('Electrical technical documentation','Техническая документация по электрике','Elektr boʻyicha texnik hujjatlar','Elektrik boýunça tehniki resminamalar','Электр бойынша техникалық құжаттама') },
      { id:'electrical-videos', title: ml('Video Tutorials','Видео уроки','Video darsliklar','Wideo sapaklar','Бейне сабақтар'), desc: ml('Electrical video tutorials','Видео уроки по электрике','Elektr boʻyicha video darsliklar','Elektrik boýunça wideo sapaklar','Электр бойынша бейне сабақтар') },
      { id:'electrical-checklist', title: ml('Checklist','Чек-лист','Tekshiruv roʻyxati','Barlag sanawy','Тексеру тізімі'), desc: ml('Electrical verification checklist','Контрольный список электромонтажных работ','Elektromontaj ishlarining tekshiruv roʻyxati','Elektromontaj işleriniň barlag sanawy','Электр монтаждау жұмыстарының тексеру тізімі'), content: { ru: `<h3>Общие требования</h3><ul><li>На объекте чисто, чистовые материалы не повреждены, мусор в одном месте</li><li>Временное освещение демонтировано и подключено на новые линии</li><li>На концах освещения установлены лампочки, на выключателях — временные выключатели</li></ul><h3>Монтаж подрозетников</h3><ul><li>Все подрозетники на необходимой высоте, погрешность ≤2 мм по вертикали и горизонтали</li><li>Установлены ровно по уровню, не выступают за плоскость штукатурки</li><li>Открытые выводы кабелей свёрнуты и замотаны плёнкой</li><li>Подрозетники внутри чистые, закрыты заглушками</li></ul><h3>Монтаж кабеля</h3><ul><li>Каждая линия маркирована</li><li>Линии ровные, параллельны стенам, без провисания, минимум перехлёстов</li><li>Расстояние между клипсами для гофры: ≤40 см прямая, ≤10 см повороты</li><li>Расстояние между площадками без гофры: 15–20 см прямая, ≤5 см повороты</li><li>Запас кабеля: 30 см для подрозетников, 50 см для светильников, 100 см для кондиционера</li><li>Проходные отверстия заполнены противопожарной пеной</li></ul><h3>Соединения и коммутация</h3><ul><li>Все соединения выполнены согласно требованиям</li><li>Весь свет и розетки работают на основной электрике</li><li>Отсутствует шлейфовое соединение заземляющего проводника в блоке розеток</li><li>Распределительные коробки только на потолке</li></ul><h3>Электрощит</h3><ul><li>Собран по проекту, аккуратно, провода маркированы</li><li>Клеммы затянуты динамометрической отвёрткой</li><li>Все УЗО и диф.автоматы срабатывают при тест-кнопке</li><li>Нагрузка равномерно распределена по фазам</li></ul><h3>Заделка штроб</h3><ul><li>Штробы заштукатурены в плоскость стены, просветы при проверке правилом отсутствуют</li><li>Подрозетники чистые, установлены в плоскость стены, надёжно зафиксированы</li></ul><h3>Упаковка</h3><ul><li>Щиты упакованы картоном с прорезью для вводного автомата</li><li>Открытые концы кабелей смотаны и упакованы в плёнку</li></ul>` } }
    ]
  },

    name: ml('Low-Voltage Systems','Слаботочные системы','Past kuchlanish tizimlari','Pes woltly ulgamlar','Төмен кернеу жүйелері'),
    cards: [
      { id:'low-voltage-documentation', title: ml('Documentation','Документация','Hujjatlar','Resminamalar','Құжаттама'), desc: ml('Low-voltage systems documentation','Документация по слаботочным системам','Past kuchlanish tizimlari hujjatlari','Pes woltly ulgamlar resminamalary','Төмен кернеу жүйелерінің құжаттамасы') },
      { id:'low-voltage-info', title: ml('Information','Информация','Maʻlumot','Maglumat','Ақпарат'), desc: ml('Low-voltage systems information','Информация о слаботочных системах','Past kuchlanish tizimlari haqida maʻlumot','Pes woltly ulgamlar hakynda maglumat','Төмен кернеу жүйелері туралы ақпарат'), content: { ru: `<p>Правила прокладки слаботочных линий аналогичны требованиям к электропроводке.</p><h3>Состав слаботочных систем</h3><ul><li>Домофоны, интернет, роутеры, точки доступа</li><li>Блоки питания для LED-лент, системы видеонаблюдения</li><li>Охранная сигнализация, спутниковое ТВ, датчики движения</li></ul><h3>Стандарты прокладки</h3><ul><li>Отдельные кабельные каналы для слаботочных линий</li><li>Синяя гофротруба ДКС 20 мм для Ethernet и ТВ-кабелей</li><li>Кабель Cat 6 HYPERLINE (запрещено: CCA-маркировка)</li><li>Оптоволокно: острые изгибы запрещены</li></ul><h3>Обжимка кабеля UTP (схема B)</h3><p>Бело-оранжевый, оранжевый, бело-зелёный, синий, бело-синий, зелёный, бело-коричневый, коричневый.</p><h3>Датчики движения</h3><ul><li><b>Микроволновые:</b> работают сквозь тонкие барьеры, больше ложных срабатываний</li><li><b>Инфракрасные:</b> точные, до 10 м, чувствительны к температуре</li><li><b>Ультразвуковые:</b> энергоэффективны, не реагируют на медленное движение</li><li><b>Комбинированные:</b> минимум ложных срабатываний, быстрый отклик</li></ul>` } },
      { id:'low-voltage-videos', title: ml('Video Tutorials','Видео уроки','Video darsliklar','Wideo sapaklar','Бейне сабақтар'), desc: ml('Low-voltage systems video tutorials','Видео уроки по слаботочным системам','Past kuchlanish tizimlari boʻyicha video darsliklar','Pes woltly ulgamlar boýunça wideo sapaklar','Төмен кернеу жүйелері бойынша бейне сабақтар') }
    ]

  {
    sort: 13, icon: '🔌',
    name: ml('Sockets & Openings','Розетки и отверстия','Rozetkalar va teshiklar','Rozetkalar we deşikler','Розеткалар және тесіктер'),
    cards: [
      { id:'sockets-documentation', title: ml('Documentation','Документация','Hujjatlar','Resminamalar','Құжаттама'), desc: ml('Sockets and openings documentation','Документация по розеткам и отверстиям','Rozetkalar va teshiklar hujjatlari','Rozetkalar we deşikler resminamalary','Розеткалар және тесіктер құжаттамасы') },
      { id:'sockets-info', title: ml('Information','Информация','Maʻlumot','Maglumat','Ақпарат'), desc: ml('Sockets and openings information','Информация о розетках и отверстиях','Rozetkalar va teshiklar haqida maʻlumot','Rozetkalar we deşikler hakynda maglumat','Розеткалар және тесіктер туралы ақпарат'), content: { ru: `<h3>Штробление</h3><ul><li>Штроба строго вертикально или горизонтально</li><li>Стандарт: 30×30 мм для гофры 20 мм</li><li>Пылесос с циклонным фильтром сразу после штробления</li><li>Минимум 15 см от края потолка</li><li><b>Запрещено:</b> перфоратор для штробления, повреждение арматуры монолита, пробивка по швам в панельных домах</li></ul><h3>Высверливание отверстий под подрозетники</h3><ul><li>Корона 72 мм (не 68 мм и не 82 мм)</li><li>Шаблоны BORISOV.PRO для точного позиционирования</li><li>Допуск ±2 мм от проектных размеров</li></ul><h3>Проходные отверстия</h3><ul><li>Проверить скрытые коммуникации перед началом</li><li>Если газ проложен скрыто — перекрыть газ</li><li>Использовать детектор арматуры</li><li>Удалять отходы каждые 2 см для охлаждения инструмента</li></ul><h3>Подготовка штробы к прокладке</h3><ul><li>Прямоугольное сечение, фаска на острых углах</li><li>Грунтовать KNAUF-MULTGRUNT перед укладкой кабеля</li></ul>` } },
      { id:'sockets-checklist', title: ml('Checklist','Чек-лист','Tekshiruv roʻyxati','Barlag sanawy','Тексеру тізімі'), desc: ml('Sockets verification checklist','Контрольный список по розеткам','Rozetkalar tekshiruv roʻyxati','Rozetkalar barlag sanawy','Розеткалар тексеру тізімі'), content: { ru: `<h3>Общие требования</h3><ul><li>Нулевой уровень выставлен точно — проверить лично руководителю проекта или прорабу</li><li>На объекте чисто, чистовые материалы не повреждены, мусор сложен в одном месте</li><li>МОП чистые</li></ul><h3>Проверка выполненных работ</h3><ul><li>Все штробы выполнены по предварительной разметке и соответствуют проектным требованиям</li><li>Все отверстия для подрозетников на одной высоте относительно друг друга согласно проекту</li><li>Штробы ровные, аккуратные и чистые; посадочное место подрозетника выглядит аккуратно</li><li>Расстояние между центрами отверстий для подрозетников составляет 71 мм</li><li>Отсутствуют повреждения штукатурного слоя</li><li>Штроба для кабеля по умолчанию заходит слева в отверстие одного подрозетника или по центру между двумя</li><li>Штроба не выходит за пределы вертикальной оси установки подрозетника</li><li>Для слаботочных линий выполнена отдельная штроба</li><li>По умолчанию штроба имеет размер 30×30 мм при прокладке кабеля в гофрированной трубе</li></ul>` } }

      { id:'hvac-checklist', title: ml('Checklist','Чек-лист','Tekshiruv roʻyxati','Barlag sanawy','Тексеру тізімі'), desc: ml('HVAC verification checklist','Контрольный список HVAC работ','HVAC ishlarining tekshiruv roʻyxati','HVAC işleriniň barlag sanawy','HVAC жұмыстарының тексеру тізімі'), content: { ru: `<h3>Общие требования</h3><ul><li>На объекте чисто, чистовые материалы не повреждены, мусор в одном месте</li><li>Пыль и мусор убираются строительным пылесосом</li></ul><h3>Чек-лист вентиляция</h3><ul><li>Запуск и пуско-наладка системы, проверка работоспособности и уровня шума</li><li>Проверить ровность крепления шпилек и крепежа воздуховодов</li><li>Проект и монтаж выполняются одной бригадой, изменения в проекте запрещены</li><li>Труба забора воздуха с улицы теплоизолирована до блока вентиляции</li><li>Смочить ладонь и поднести к решетке КСД — должна ощущаться прохлада (проверка с закрытыми окнами и дверьми)</li><li>Проверить пропускную способность декоративных решёток</li><li>Проверить систему тепловизором в холодное время года (особенно повороты и примыкания к стене)</li></ul><h3>Чек-лист пластиковый вентиляционный канал</h3><ul><li>Конечная точка вытяжки соответствует проекту</li><li>Правильность соединений каналов</li><li>Допуск по вертикали: не более 2 мм на 1 м</li><li>Минимальное расстояние до инженерных сетей 250 мм, до электропроводки ≥300 мм</li><li>Расстояние между круглыми воздуховодами ≥250 мм; разъёмные соединения ≥100 мм от мест прохода сквозь стены</li></ul><h3>Чек-лист кондиционер</h3><ul><li>Корпус без повреждений</li><li>Медная трасса герметична, заломов нет, теплоизолирована и обёрнута ПВХ плёнкой</li><li>Уклон дренажа 1–3 см на 1 м, конденсат в канализацию</li><li>Система опрессована азотом, фреон закачан вакуумным насосом</li></ul>` } }

  {
    sort: 15, icon: '📏',
    name: ml('Screed','Стяжка','Qopqoq','Doldurgyç','Қабат'),
    cards: [
      { id:'height-calculation', title: ml('Height Calculation','Расчет высот','Balandlikni hisoblash','Beýikligi hasaplamak','Биіктікті есептеу'), desc: ml('Floor height calculation methods','Методы расчета высот пола','Pol balandligini hisoblash usullari','Pol beýikligini hasaplamak usullary','Еден биіктігін есептеу әдістері'), content: { ru: `<h3>Определение нулевого уровня</h3><ul><li>Лазерный осепостроитель разместить так, чтобы луч попадал во все помещения</li><li>Не переставлять из помещения в помещение — будут погрешности</li><li>В произвольном месте выставить первую метку, перенести лазером на все стены всех помещений</li><li>Соединить метки горизонтальной линией — это нулевой уровень</li></ul><h3>Определение перепада высот</h3><ul><li>Измерить расстояние от нулевого уровня до существующего пола в разных местах</li><li>Наименьшее значение = самая высокая точка пола</li><li>Разность значений = перепад высот</li><li>Пример: мин. 1,22 м и макс. 1,27 м → перепад 5 см</li></ul><h3>Минимальная толщина стяжки</h3><ul><li>Из цементного раствора с пластификатором: минимум 30 мм</li><li>Сводить стяжку «под ноль» категорически недопустимо</li><li>Для ровнителей и самовыравнивающихся смесей: по инструкции производителя</li></ul><h3>Расчёт разноуровневой стяжки</h3><ul><li>При разных напольных покрытиях — стяжка на разных уровнях, чтобы не было порогов на стыках</li><li>Пример: паркет — 30 мм «пирог» (2 мм мастика + 12 мм фанера + 1 мм клей + 16 мм паркет − 1 мм циклёвка), плитка — 16 мм (6 мм клей + 10 мм плитка)</li><li>Перепад стяжки = 30 − 16 = 14 мм; рекомендуется добавить 2 мм запаса</li></ul>` } },
      { id:'semi-dry-screed', title: ml('Semi-Dry Screed','Полусухая стяжка','Yarim quruq qopqoq','Ýarym gury doldurgyç','Жартылай құрғақ қабат'), desc: ml('Semi-dry screed installation','Устройство полусухой стяжки','Yarim quruq qopqoq oʻrnatish','Ýarym gury doldurgyç ornaşdyrmak','Жартылай құрғақ қабат орнату'), content: { ru: `<h3>Ключевые требования к стяжке</h3><ul><li>Выбор метода зависит от типа объекта, нагрузки на пол и требований проекта</li><li>Стяжка 5 см весит до 100 кг — учитывать при расчёте нагрузок</li><li>Плавающий пол: минимум 4 см, обязательно армирование</li><li>Цементно-песчаная стяжка не менее 3 см (иначе трескается)</li></ul><h3>Запрещено</h3><ul><li>Гипсовые маяки в цементно-песчаном растворе</li><li>Открывать окна в течение 14 дней после заливки</li><li>Перегружать несущие конструкции при монтаже</li><li>Полусухая стяжка поверх работающего водяного отопления</li><li>«Нулевые» стяжки без альтернативных решений</li><li>Использовать просроченные смеси</li><li>Разбивать заливку на несколько дней без деформационных швов</li></ul><h3>Рекомендация АВЕНКО</h3><p>Мокрая стяжка с небольшим запасом по высоте — наиболее надёжный метод, не требующий наливного пола после шлифовки.</p>` } },
      { id:'wet-screed', title: ml('Wet Screed','Мокрая стяжка','Hoʻl qopqoq','Öl doldurgyç','Ылғал қабат'), desc: ml('Wet screed installation','Устройство мокрой стяжки','Hoʻl qopqoq oʻrnatish','Öl doldurgyç ornaşdyrmak','Ылғал қабат орнату'), content: { ru: `<h3>Интеграция конвектора в стяжку</h3><ul><li>Вентилятор конвектора должен дуть в сторону окна</li><li>Датчики протечки в каждом конвекторе через гофру</li><li>Обернуть конвектор мягким материалом 1 см со всех сторон</li><li>Оставить доступ к крепёжным элементам</li></ul>` } },
      { id:'dry-screed', title: ml('Dry Screed','Сухая стяжка','Quruq qopqoq','Gury doldurgyç','Құрғақ қабат'), desc: ml('Dry screed installation','Устройство сухой стяжки','Quruq qopqoq oʻrnatish','Gury doldurgyç ornaşdyrmak','Құрғақ қабат орнату'), content: { ru: `<h3>Общие требования</h3><ul><li>Минимальный слой керамзитового песка — 20 мм, максимум — 100 мм</li><li>Данный тип стяжки всегда должен оставаться сухим</li><li>При затоплении помещения сухая стяжка подлежит полной замене</li><li>Компанией АВЕНКО данный вариант стяжки не применяется</li></ul><h3>Материалы</h3><ul><li>ГВЛ листы размером 60×120 см</li><li>Керамзитовый песок мелкой фракции 0–5 мм, влажность не более 0,5%</li><li>Полиэтиленовая плёнка в качестве пароизоляции</li><li>Шурупы MN30 для крепления ГВЛ, клей ПВА</li><li>Демпферная кромочная лента по периметру стен</li></ul><h3>Подготовительные работы</h3><ul><li>Удалить старое напольное покрытие до железобетонного основания, выполнить уборку</li><li>Заделать все выемки, трещины и сколы цементно-песчаным раствором, нанести грунт</li><li>Все влажные процессы на объекте должны быть закончены до устройства сухой стяжки</li><li>Уложить пароизоляционную плёнку с заходом на стены 20 см; полосы перехлёстываются на 20 см и проклеиваются скотчем</li><li>Смонтировать демпферную ленту по периметру стен</li></ul><h3>Монтаж ГВЛ</h3><ul><li>Выставить маяки-рейки и засыпать керамзит участками; распределять выравнивающей рейкой по лазерному уровню</li><li>Утрамбовать засыпку вдоль стен гладилкой; при слое более 5 см утрамбовать всю поверхность</li><li>Укладывать листы ГВЛ начиная от дверного проёма; передвигаться только по уложенным фрагментам ГВЛ</li><li>На фальц каждого элемента нанести клей ПВА, перекрыть вторым листом; соединить шурупами с шагом не более 30 мм</li><li>Зазоры между стыками не более 1 мм; смещение листов — не менее 250 мм в каждом ряду</li><li>Демпферную ленту, выступающую над полом, срезать; зазор между стеной и стяжкой заполнить герметиком</li><li>Укладку напольного покрытия выполнять не ранее чем через 24 часа</li></ul>` } },
