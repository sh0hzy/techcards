<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Админ-панель — KAZARBUILD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body data-page="admin">
  <header class="header">
    <a href="index.html" class="logo">KAZARBUILD</a>
    <span class="admin-badge"></span>
    <button class="logout-btn" id="logout-btn" style="display:none;">Выйти</button>
  </header>

  <main class="admin-main">

    <div class="auth-screen" id="auth-screen">
      <div class="auth-box">
        <h2>Админ</h2>
        <form id="auth-form">
          <input type="password" id="admin-password" placeholder="Пароль" autocomplete="current-password">
          <button type="submit">Войти</button>
        </form>
        <p class="auth-error" id="auth-error"></p>
      </div>
    </div>
    <div class="admin-panel" id="admin-panel" style="display: none;">
      
      <aside class="admin-sidebar">
        <div class="sidebar-header">
          <h3>Карты</h3>
          <button class="btn-add" id="add-card-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
        <div class="cards-list" id="cards-list"></div>
        <div class="sidebar-data-actions">
          <button class="sidebar-data-btn migrate" id="migrate-btn" title="Загрузить данные из Supabase напрямую">↓ Импорт из Supabase</button>
          <button class="sidebar-data-btn csv" id="csv-btn" title="Импорт из CSV файлов (экспорт Supabase)">↓ Импорт CSV</button>
          <button class="sidebar-data-btn export" id="export-btn" title="Экспорт данных в JSON файл">↑ Экспорт JSON</button>
          <button class="sidebar-data-btn import" id="import-btn" title="Импорт данных из JSON файла">↑ Импорт JSON</button>
        </div>
      </aside>

      <div class="admin-editor" id="admin-editor">
        <div class="editor-placeholder" id="editor-placeholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          
        </div>

        <div class="editor-form" id="editor-form" style="display: none;">
          <input type="hidden" id="card-id">
          
          <div class="editor-header">
            <div class="editor-tabs" id="lang-tabs">
              <button class="editor-tab active" data-lang="ru">RU</button>
              <button class="editor-tab" data-lang="kz">KZ</button>
              <button class="editor-tab" data-lang="uz">UZ</button>
              <button class="editor-tab" data-lang="en">EN</button>
              <button class="editor-tab" data-lang="tk">TK</button>
              <button class="btn-translate" id="translate-btn" title="Перевести с русского на все языки">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"></path>
                </svg>
                Перевести
              </button>
            </div>
            <div class="editor-actions">
              <button class="btn-secondary" id="preview-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                Предпросмотр
              </button>
              <button class="btn-danger" id="delete-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Удалить
              </button>
              <button class="btn-primary" id="save-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                  <polyline points="17 21 17 13 7 13 7 21"></polyline>
                  <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Сохранить
              </button>
            </div>
          </div>

<div class="editor-content">
  

  <div class="current-lang-indicator">
    <span>Редактирование на языке:</span>
    <strong id="current-lang-label">Русский</strong>
  </div>

  <div class="form-section">
    <label class="form-label">Изображения Hero (слайдер)</label>
    <div class="images-grid" id="hero-images"></div>
    <div class="image-upload-zone" id="hero-upload-zone">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <p>Перетащите изображения или <span>выберите файл</span></p>
      <p class="upload-hint">Или вставьте URL изображения</p>
      <input type="file" id="hero-file-input" accept="image/*" multiple hidden>
      <input type="url" id="hero-url-input" placeholder="https://example.com/image.jpg">
      <button type="button" class="btn-small" id="hero-url-add">Добавить URL</button>
    </div>
  </div>

  <div class="form-row">
    <div class="form-section flex-1">
      <label class="form-label">Категория</label>
      <select id="category-select">
        <option value="">— Без категории —</option>
      </select>
    </div>
    <div class="form-section">
      <label class="form-label">Статус</label>
      <label class="toggle-label">
        <input type="checkbox" id="is-published" checked>
        <span class="toggle"></span>
        <span class="toggle-text">Опубликовано</span>
      </label>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">Заголовок</label>
    <input type="text" id="title-input" class="input-large" placeholder="Заголовок карточки">
  </div>

  <div class="form-section">
    <label class="form-label">Краткое описание</label>
    <textarea id="description-input" placeholder="Краткое описание для карточки" rows="3"></textarea>
  </div>
  <div class="form-section">
    <div class="section-header">
      <label class="form-label">Секции контента</label>
      <button type="button" class="btn-small" id="add-section-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Добавить секцию
      </button>
    </div>
    <div class="sections-list" id="sections-list"></div>
  </div>
  <div  class="form-section">
    <label class="form-label">Чек-лист</label>
    <textarea id="checklist-input" class="checklist-input" placeholder="Каждый пункт с новой строки:&#10;- Пункт 1&#10;- Пункт 2&#10;- Пункт 3" rows="6"></textarea>
  </div>

</div>
          
        </div>
      </div>
    </div>
    <div class="preview-modal" id="preview-modal">
      <div class="preview-header">
        <span>Предпросмотр</span>
        <button class="preview-close" id="preview-close">&times;</button>
      </div>
      <div class="preview-frame">
        <iframe id="preview-iframe"></iframe>
      </div>
    </div>

  </main>
<template id="section-template">
  <div class="content-section" data-index="">
    <div class="section-drag-handle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="5" r="1"></circle>
        <circle cx="9" cy="12" r="1"></circle>
        <circle cx="9" cy="19" r="1"></circle>
        <circle cx="15" cy="5" r="1"></circle>
        <circle cx="15" cy="12" r="1"></circle>
        <circle cx="15" cy="19" r="1"></circle>
      </svg>
    </div>
    <div class="section-content">
      <input type="text" class="section-title-input" placeholder="Заголовок секции">
      <div class="editor-toolbar">
        <div class="toolbar-group">
          <button type="button" data-command="bold" title="Жирный (Ctrl+B)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
              <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
            </svg>
          </button>
          <button type="button" data-command="italic" title="Курсив (Ctrl+I)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="4" x2="10" y2="4"></line>
              <line x1="14" y1="20" x2="5" y2="20"></line>
              <line x1="15" y1="4" x2="9" y2="20"></line>
            </svg>
          </button>
          <button type="button" data-command="underline" title="Подчёркнутый (Ctrl+U)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path>
              <line x1="4" y1="21" x2="20" y2="21"></line>
            </svg>
          </button>
          <button type="button" data-command="strikeThrough" title="Зачёркнутый">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.3 4.9c-1.5-1.4-3.5-1.9-5.4-1.9-3.2 0-5.9 1.9-5.9 5.3 0 1.6.6 2.8 1.6 3.7"></path>
              <path d="M4 12h16"></path>
              <path d="M6.7 19.1c1.5 1.4 3.5 1.9 5.4 1.9 3.2 0 5.9-1.9 5.9-5.3 0-1.6-.6-2.8-1.6-3.7"></path>
            </svg>
          </button>
          <div class="toolbar-color" title="Фон выделенного текста">
            <button type="button" class="toolbar-bgcolor-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
              </svg>
              <span class="toolbar-color-bar" id="main-bgcolor-bar" style="background:#ffff00;"></span>
            </button>
            <input type="color" class="toolbar-bgcolor-input" value="#ffff00" title="Фон текста">
          </div>
        </div>

        <span class="toolbar-divider"></span>

        <div class="toolbar-group">
          <select class="toolbar-select" data-command="formatBlock" title="Формат">
            <option value="">Обычный текст</option>
            <option value="h2">Заголовок 2</option>
            <option value="h3">Заголовок 3</option>
            <option value="h4">Заголовок 4</option>
            <option value="blockquote">Цитата</option>
            <option value="pre">Код</option>
          </select>
        </div>

        <span class="toolbar-divider"></span>

        <!-- Размер шрифта -->
        <div class="toolbar-group">
          <select class="toolbar-select toolbar-fontsize" title="Размер шрифта">
            <option value="">Размер</option>
            <option value="1">8px</option>
            <option value="2">10px</option>
            <option value="3">12px</option>
            <option value="4">14px</option>
            <option value="5">18px</option>
            <option value="6">24px</option>
            <option value="7">36px</option>
          </select>
        </div>

        <span class="toolbar-divider"></span>

        <!-- Списки -->
        <div class="toolbar-group">
          <button type="button" data-command="insertUnorderedList" title="Маркированный список">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <circle cx="4" cy="6" r="1" fill="currentColor"></circle>
              <circle cx="4" cy="12" r="1" fill="currentColor"></circle>
              <circle cx="4" cy="18" r="1" fill="currentColor"></circle>
            </svg>
          </button>
          <button type="button" data-command="insertOrderedList" title="Нумерованный список">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="10" y1="6" x2="21" y2="6"></line>
              <line x1="10" y1="12" x2="21" y2="12"></line>
              <line x1="10" y1="18" x2="21" y2="18"></line>
              <text x="2" y="8" font-size="8" fill="currentColor" stroke="none">1.</text>
              <text x="2" y="14" font-size="8" fill="currentColor" stroke="none">2.</text>
              <text x="2" y="20" font-size="8" fill="currentColor" stroke="none">3.</text>
            </svg>
          </button>
        </div>

        <span class="toolbar-divider"></span>

        <div class="toolbar-group">
          <button type="button" data-command="justifyLeft" title="По левому краю">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="15" y2="12"></line>
              <line x1="3" y1="18" x2="18" y2="18"></line>
            </svg>
          </button>
          <button type="button" data-command="justifyCenter" title="По центру">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="6" y1="12" x2="18" y2="12"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>
          <button type="button" data-command="justifyRight" title="По правому краю">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="9" y1="12" x2="21" y2="12"></line>
              <line x1="6" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>

        <span class="toolbar-divider"></span>


        <div class="toolbar-group">
          <button type="button" class="toolbar-link-btn" title="Ссылка">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </button>
          <button type="button" class="toolbar-image-btn" title="Изображение">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </button>
          <button type="button" class="toolbar-video-btn" title="Видео YouTube">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
          <button type="button" class="toolbar-carousel-btn" title="Карусель изображений">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="6" width="20" height="12" rx="2"></rect>
              <circle cx="7" cy="18" r="1"></circle>
              <circle cx="12" cy="18" r="1"></circle>
              <circle cx="17" cy="18" r="1"></circle>
              <polyline points="6 10 9 13 6 16"></polyline>
              <polyline points="18 10 15 13 18 16"></polyline>
            </svg>
          </button>
          <button type="button" class="toolbar-table-btn" title="Таблица">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="3" y1="15" x2="21" y2="15"></line>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
          </button>
        </div>

        <span class="toolbar-divider"></span>
        <div class="toolbar-group">
          <button type="button" data-command="outdent" title="Уменьшить отступ">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="7 8 3 12 7 16"></polyline>
              <line x1="21" y1="6" x2="11" y2="6"></line>
              <line x1="21" y1="12" x2="11" y2="12"></line>
              <line x1="21" y1="18" x2="11" y2="18"></line>
            </svg>
          </button>
          <button type="button" data-command="indent" title="Увеличить отступ">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 8 7 12 3 16"></polyline>
              <line x1="21" y1="6" x2="11" y2="6"></line>
              <line x1="21" y1="12" x2="11" y2="12"></line>
              <line x1="21" y1="18" x2="11" y2="18"></line>
            </svg>
          </button>
        </div>

        <span class="toolbar-divider"></span>
        <div class="toolbar-group">
          <button type="button" data-command="removeFormat" title="Очистить форматирование">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 7V4h16v3"></path>
              <path d="M9 20h6"></path>
              <path d="M12 4v16"></path>
              <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>
            </svg>
          </button>
          <button type="button" data-command="undo" title="Отменить (Ctrl+Z)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
          </button>
          <button type="button" data-command="redo" title="Повторить (Ctrl+Y)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 7v6h-6"></path>
              <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="rich-editor" contenteditable="true" data-placeholder="Введите текст секции..."></div>
      <div class="section-images"></div>

      <!-- Вложенные секции -->
      <div class="nested-sections-container">
        <div class="nested-sections-header">
          <span class="nested-sections-label">Вложенные секции</span>
          <button type="button" class="btn-add-nested" title="Добавить вложенную секцию">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Добавить подраздел</span>
          </button>
        </div>
        <div class="nested-sections-list"></div>
      </div>
    </div>
    <button type="button" class="section-remove" title="Удалить секцию">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</template>
<template id="nested-section-template">
  <div class="nested-section-item" data-nested-index="">
    <div class="nested-section-header">
      <div class="nested-drag-handle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="5" r="1"></circle>
          <circle cx="9" cy="12" r="1"></circle>
          <circle cx="9" cy="19" r="1"></circle>
          <circle cx="15" cy="5" r="1"></circle>
          <circle cx="15" cy="12" r="1"></circle>
          <circle cx="15" cy="19" r="1"></circle>
        </svg>
      </div>
      <input type="text" class="nested-section-title" placeholder="Заголовок подраздела">
      <button type="button" class="nested-section-remove" title="Удалить">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
