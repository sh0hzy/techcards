<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Админ-панель — KAZARBUILD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body data-page="admin">
  <header class="header">
    <a href="index.html" class="logo">KAZARBUILD</a>
    <span class="admin-badge">ADMIN</span>
    <button class="logout-btn" id="logout-btn" style="display:none;">Выйти</button>
  </header>

  <main class="admin-main">
    <!-- Авторизация -->
    <div class="auth-screen" id="auth-screen">
      <div class="auth-box">
        <h2>Вход в админ-панель</h2>
        <form id="auth-form">
          <input type="password" id="admin-password" placeholder="Пароль" autocomplete="current-password">
          <button type="submit">Войти</button>
        </form>
        <p class="auth-error" id="auth-error"></p>
      </div>
    </div>

    <!-- Админ-панель -->
    <div class="admin-panel" id="admin-panel" style="display: none;">
      
      <!-- Sidebar - список карточек -->
      <aside class="admin-sidebar">
        <div class="sidebar-header">
          <h3>Карточки</h3>
          <button class="btn-add" id="add-card-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
        <div class="cards-list" id="cards-list">
          <!-- Загружается из JS -->
        </div>
      </aside>

      <!-- Основная область редактирования -->
      <div class="admin-editor" id="admin-editor">
        <div class="editor-placeholder" id="editor-placeholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <p>Выберите карточку для редактирования<br>или создайте новую</p>
        </div>

        <!-- Форма редактирования -->
        <div class="editor-form" id="editor-form" style="display: none;">
          <input type="hidden" id="card-id">
          
          <!-- Header формы -->
          <div class="editor-header">
            <div class="editor-tabs" id="lang-tabs">
              <button class="editor-tab active" data-lang="ru">RU</button>
              <button class="editor-tab" data-lang="kk">KK</button>
              <button class="editor-tab" data-lang="uz">UZ</button>
              <button class="editor-tab" data-lang="en">EN</button>
              <button class="editor-tab" data-lang="tk">TK</button>
            </div>
            <div class="editor-actions">
              <button class="btn-secondary" id="preview-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                Предпросмотр
              </button>
              <button class="btn-danger" id="delete-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Удалить
              </button>
              <button class="btn-primary" id="save-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                  <polyline points="17 21 17 13 7 13 7 21"></polyline>
                  <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Сохранить
              </button>
            </div>
          </div>

          <!-- Контент формы -->
          <div class="editor-content">
            <!-- Hero изображения -->
            <div class="form-section">
              <label class="form-label">Изображения Hero (слайдер)</label>
              <div class="images-grid" id="hero-images">
                <!-- Загружается из JS -->
              </div>
              <div class="image-upload-zone" id="hero-upload-zone">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <p>Перетащите изображения или <span>выберите файл</span></p>
                <p class="upload-hint">Или вставьте URL изображения</p>
                <input type="file" id="hero-file-input" accept="image/*" multiple hidden>
                <input type="url" id="hero-url-input" placeholder="https://example.com/image.jpg">
                <button type="button" class="btn-small" id="hero-url-add">Добавить URL</button>
              </div>
            </div>

            <!-- Категория и статус -->
            <div class="form-row">
              <div class="form-section flex-1">
                <label class="form-label">Категория</label>
                <select id="category-select">
                  <option value="">— Без категории —</option>
                </select>
              </div>
              <div class="form-section">
                <label class="form-label">Статус</label>
                <label class="toggle-label">
                  <input type="checkbox" id="is-published" checked>
                  <span class="toggle"></span>
                  <span class="toggle-text">Опубликовано</span>
                </label>
              </div>
            </div>

            <!-- Заголовок -->
            <div class="form-section">
              <label class="form-label">Заголовок</label>
              <div class="lang-inputs" data-field="title">
                <input type="text" class="input-large lang-field" data-lang="ru" placeholder="Заголовок карточки (RU)">
                <input type="text" class="input-large lang-field" data-lang="kk" placeholder="Заголовок (KK)" style="display:none;">
                <input type="text" class="input-large lang-field" data-lang="uz" placeholder="Заголовок (UZ)" style="display:none;">
                <input type="text" class="input-large lang-field" data-lang="en" placeholder="Заголовок (EN)" style="display:none;">
                <input type="text" class="input-large lang-field" data-lang="tk" placeholder="Заголовок (TK)" style="display:none;">
              </div>
            </div>

            <!-- Описание -->
            <div class="form-section">
              <label class="form-label">Краткое описание</label>
              <div class="lang-inputs" data-field="description">
                <textarea class="lang-field" data-lang="ru" placeholder="Краткое описание для карточки (RU)" rows="3"></textarea>
                <textarea class="lang-field" data-lang="kk" placeholder="Описание (KK)" rows="3" style="display:none;"></textarea>
                <textarea class="lang-field" data-lang="uz" placeholder="Описание (UZ)" rows="3" style="display:none;"></textarea>
                <textarea class="lang-field" data-lang="en" placeholder="Описание (EN)" rows="3" style="display:none;"></textarea>
                <textarea class="lang-field" data-lang="tk" placeholder="Описание (TK)" rows="3" style="display:none;"></textarea>
              </div>
            </div>

            <!-- Секции контента -->
            <div class="form-section">
              <div class="section-header">
                <label class="form-label">Секции контента</label>
                <button type="button" class="btn-small" id="add-section-btn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  Добавить секцию
                </button>
              </div>
              <div class="sections-list" id="sections-list">
                <!-- Секции добавляются из JS -->
              </div>
            </div>

            <!-- Чек-лист -->
            <div class="form-section">
              <label class="form-label">Чек-лист</label>
              <div class="lang-inputs" data-field="checklist">
                <textarea class="lang-field checklist-input" data-lang="ru" placeholder="Каждый пункт с новой строки:&#10;- Пункт 1&#10;- Пункт 2&#10;- Пункт 3" rows="6"></textarea>
                <textarea class="lang-field checklist-input" data-lang="kk" placeholder="Чек-лист (KK)" rows="6" style="display:none;"></textarea>
                <textarea class="lang-field checklist-input" data-lang="uz" placeholder="Чек-лист (UZ)" rows="6" style="display:none;"></textarea>
                <textarea class="lang-field checklist-input" data-lang="en" placeholder="Checklist (EN)" rows="6" style="display:none;"></textarea>
                <textarea class="lang-field checklist-input" data-lang="tk" placeholder="Чек-лист (TK)" rows="6" style="display:none;"></textarea>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Модальное окно предпросмотра -->
    <div class="preview-modal" id="preview-modal">
      <div class="preview-header">
        <span>Предпросмотр</span>
        <button class="preview-close" id="preview-close">&times;</button>
      </div>
      <div class="preview-frame">
        <iframe id="preview-iframe"></iframe>
      </div>
    </div>

  </main>

  <!-- Шаблон секции -->
  <template id="section-template">
    <div class="content-section" data-section-id="">
      <div class="section-drag-handle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="5" r="1"></circle>
          <circle cx="9" cy="12" r="1"></circle>
          <circle cx="9" cy="19" r="1"></circle>
          <circle cx="15" cy="5" r="1"></circle>
          <circle cx="15" cy="12" r="1"></circle>
          <circle cx="15" cy="19" r="1"></circle>
        </svg>
      </div>
      <div class="section-content">
        <input type="text" class="section-title-input" placeholder="Заголовок секции">
        
        <!-- Toolbar редактора -->
        <div class="editor-toolbar">
          <button type="button" data-command="bold" title="Жирный (Ctrl+B)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
              <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
            </svg>
          </button>
          <button type="button" data-command="italic" title="Курсив (Ctrl+I)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="4" x2="10" y2="4"></line>
              <line x1="14" y1="20" x2="5" y2="20"></line>
              <line x1="15" y1="4" x2="9" y2="20"></line>
            </svg>
          </button>
          <button type="button" data-command="underline" title="Подчёркнутый (Ctrl+U)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path>
              <line x1="4" y1="21" x2="20" y2="21"></line>
            </svg>
          </button>
          <span class="toolbar-divider"></span>
          <button type="button" data-command="insertUnorderedList" title="Маркированный список">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <circle cx="4" cy="6" r="1" fill="currentColor"></circle>
              <circle cx="4" cy="12" r="1" fill="currentColor"></circle>
              <circle cx="4" cy="18" r="1" fill="currentColor"></circle>
            </svg>
          </button>
          <button type="button" data-command="insertOrderedList" title="Нумерованный список">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="10" y1="6" x2="21" y2="6"></line>
              <line x1="10" y1="12" x2="21" y2="12"></line>
              <line x1="10" y1="18" x2="21" y2="18"></line>
              <text x="4" y="7" font-size="8" fill="currentColor">1</text>
              <text x="4" y="13" font-size="8" fill="currentColor">2</text>
              <text x="4" y="19" font-size="8" fill="currentColor">3</text>
            </svg>
          </button>
          <span class="toolbar-divider"></span>
          <button type="button" data-command="formatBlock" data-value="h3" title="Заголовок">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="4 7 4 4 20 4 20 7"></polyline>
              <line x1="9" y1="20" x2="15" y2="20"></line>
              <line x1="12" y1="4" x2="12" y2="20"></line>
            </svg>
          </button>
          <button type="button" class="toolbar-image-btn" title="Добавить изображение">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </button>
          <span class="toolbar-divider"></span>
          <button type="button" data-command="removeFormat" title="Очистить форматирование">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        
        <!-- Редактируемая область -->
        <div class="rich-editor" contenteditable="true" data-placeholder="Введите текст секции..."></div>
        
        <!-- Изображения секции -->
        <div class="section-images">
          <!-- Изображения добавляются из JS -->
        </div>
      </div>
      <button type="button" class="section-remove" title="Удалить секцию">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </template>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
