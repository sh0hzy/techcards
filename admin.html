<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Админ-панель — KAZARBUILD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body data-page="admin">
  <header class="header">
    <a href="index.html" class="logo">KAZARBUILD</a>
    <span class="admin-badge">ADMIN</span>
  </header>

  <main class="admin-container">
    <!-- Авторизация -->
    <div class="auth-form" id="auth-form">
      <h2>Вход в админ-панель</h2>
      <input type="password" id="admin-password" placeholder="Пароль">
      <button id="auth-btn">Войти</button>
      <p class="auth-error" id="auth-error"></p>
    </div>

    <!-- Админ-панель -->
    <div class="admin-panel" id="admin-panel" style="display: none;">
      <!-- Список карточек -->
      <div class="admin-section">
        <div class="section-header">
          <h2>Карточки</h2>
          <button class="btn-primary" id="add-card-btn">+ Добавить карточку</button>
        </div>
        <div class="cards-list" id="cards-list">
          <!-- Загружается из JS -->
        </div>
      </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="card-modal">
        <div class="modal-header">
          <h3 id="modal-title">Новая карточка</h3>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        
        <div class="modal-body">
          <!-- Табы языков -->
          <div class="lang-tabs">
            <button class="lang-tab active" data-lang="ru">RU</button>
            <button class="lang-tab" data-lang="kk">KK</button>
            <button class="lang-tab" data-lang="uz">UZ</button>
            <button class="lang-tab" data-lang="en">EN</button>
            <button class="lang-tab" data-lang="tk">TK</button>
          </div>

          <form id="card-form">
            <input type="hidden" id="card-id">
            
            <!-- Заголовок -->
            <div class="form-group">
              <label>Заголовок</label>
              <input type="text" id="title-ru" placeholder="Заголовок (RU)" class="lang-input" data-lang="ru">
              <input type="text" id="title-kk" placeholder="Заголовок (KK)" class="lang-input" data-lang="kk" style="display:none;">
              <input type="text" id="title-uz" placeholder="Заголовок (UZ)" class="lang-input" data-lang="uz" style="display:none;">
              <input type="text" id="title-en" placeholder="Заголовок (EN)" class="lang-input" data-lang="en" style="display:none;">
              <input type="text" id="title-tk" placeholder="Заголовок (TK)" class="lang-input" data-lang="tk" style="display:none;">
            </div>

            <!-- Описание -->
            <div class="form-group">
              <label>Описание</label>
              <textarea id="description-ru" placeholder="Описание (RU)" class="lang-input" data-lang="ru"></textarea>
              <textarea id="description-kk" placeholder="Описание (KK)" class="lang-input" data-lang="kk" style="display:none;"></textarea>
              <textarea id="description-uz" placeholder="Описание (UZ)" class="lang-input" data-lang="uz" style="display:none;"></textarea>
              <textarea id="description-en" placeholder="Описание (EN)" class="lang-input" data-lang="en" style="display:none;"></textarea>
              <textarea id="description-tk" placeholder="Описание (TK)" class="lang-input" data-lang="tk" style="display:none;"></textarea>
            </div>

            <!-- Категория -->
            <div class="form-group">
              <label>Категория</label>
              <select id="category-select">
                <option value="">-- Выберите --</option>
              </select>
            </div>

            <!-- Изображения -->
            <div class="form-group">
              <label>Изображения (URL, по одному на строку)</label>
              <textarea id="images-input" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg"></textarea>
            </div>

            <!-- Контент (секции) -->
            <div class="form-group">
              <label>Секции контента</label>
              <div id="sections-container"></div>
              <button type="button" class="btn-secondary" id="add-section-btn">+ Добавить секцию</button>
            </div>

            <!-- Чек-лист -->
            <div class="form-group">
              <label>Чек-лист (по одному пункту на строку)</label>
              <textarea id="checklist-ru" placeholder="Пункт 1&#10;Пункт 2&#10;Пункт 3" class="lang-input" data-lang="ru"></textarea>
              <textarea id="checklist-kk" placeholder="Пункт 1 (KK)" class="lang-input" data-lang="kk" style="display:none;"></textarea>
              <textarea id="checklist-uz" placeholder="Пункт 1 (UZ)" class="lang-input" data-lang="uz" style="display:none;"></textarea>
              <textarea id="checklist-en" placeholder="Пункт 1 (EN)" class="lang-input" data-lang="en" style="display:none;"></textarea>
              <textarea id="checklist-tk" placeholder="Пункт 1 (TK)" class="lang-input" data-lang="tk" style="display:none;"></textarea>
            </div>

            <!-- Публикация -->
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="is-published" checked>
                Опубликовано
              </label>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="cancel-btn">Отмена</button>
          <button class="btn-danger" id="delete-btn" style="display:none;">Удалить</button>
          <button class="btn-primary" id="save-btn">Сохранить</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
